<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Taxi · Commissions — Démo</title><style>body{font:16px system-ui;background:#071b33;color:white;margin:0;padding:18px}main{max-width:680px;margin:auto}h1{font-size:26px}section{background:#122c4c;border-radius:16px;padding:16px;margin:14px 0}button,input,select{font:inherit;padding:12px;border:0;border-radius:10px;margin:5px 3px}button{background:#2787ee;color:white}input,select{max-width:95%}.muted{color:#b9c9df}article{border-top:1px solid #456;padding:10px 0}strong{color:#76e6b3}</style><main><h1>🚕 Mon Taxi · Commissions</h1><p class="muted">Version de démonstration isolée : aucune connexion à tes recettes réelles, aucune synchronisation.</p><section><h2>Nouvelle course</h2><label>Hôtel <select id="hotel"><option>DoubleTree</option><option>The Standard</option></select></label><div id="contacts"></div><label>Destination <select id="dest"><option>Airport BRU</option><option>Airport CRL</option><option>Autre</option></select></label><label>Véhicule <select id="vehicle"><option>Petite voiture</option><option>Van</option></select></label><label>Mode <select id="mode"><option>Direct</option><option>Réservation</option></select></label><p><label>Date et heure <input id="date" type="datetime-local"></label></p><p><label>Commission (€) <input id="amount" type="number" min="0" step=".01" value="10"></label></p><p><label>Chambre <input id="room" placeholder="N° de chambre"></label></p><p><label>Remarque <input id="note" placeholder="Facultatif"></label></p><button id="save">Enregistrer</button></section><section><h2>Programme</h2><div id="planned"></div></section><section><h2>Commissions DoubleTree</h2><div id="dt"></div><h2>Commissions The Standard</h2><div id="st"></div></section><section><button id="reset">Effacer les données de démonstration</button></section></main><script>
const names={'DoubleTree':['Night','Day','Papas'],'The Standard':['Fal','Moncef','Djo','Jonas','Yaguy','Céline','Adelia','Diego','Estella','Sumira','Aline']};const $=id=>document.getElementById(id);let rows=JSON.parse(localStorage.getItem('monTaxiCommissionDemoOnly')||'[]');let contact='Papas';function contacts(){let n=names[$('hotel').value];contact=n.includes(contact)?contact:n[0];$('contacts').innerHTML='<p>Contact</p>'+n.map(x=>'<button data-contact="'+x+'" style="background:'+(x===contact?'#16865f':'#345477')+'">'+x+'</button>').join('');document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{contact=b.dataset.contact;contacts()})}function persist(){localStorage.setItem('monTaxiCommissionDemoOnly',JSON.stringify(rows));render()}function safe(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let p=rows.filter(x=>x.status==='Programmée').sort((a,b)=>a.date.localeCompare(b.date));$('planned').innerHTML=p.length?p.map(x=>'<article>'+safe(x.date)+' · '+safe(x.hotel)+' · '+safe(x.contact)+' · '+safe(x.dest)+' · '+safe(x.vehicle)+' · '+x.amount.toFixed(2)+' €<br><button data-done="'+x.id+'">Effectuée</button><button data-cancel="'+x.id+'">Non effectuée</button></article>').join(''):'Aucune réservation programmée';for(let [hotel,id] of [['DoubleTree','dt'],['The Standard','st']]){let done=rows.filter(x=>x.hotel===hotel&&x.status==='Effectuée');$(''+id).innerHTML='<strong>Total : '+done.reduce((s,x)=>s+x.amount,0).toFixed(2)+' €</strong>'+done.map(x=>'<article>'+safe(x.date)+' · '+safe(x.contact)+' · '+safe(x.dest)+' · '+x.amount.toFixed(2)+' €</article>').join('')}document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{rows.find(x=>x.id===b.dataset.done).status='Effectuée';persist()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{rows.find(x=>x.id===b.dataset.cancel).status='Non effectuée';persist()})} $('hotel').onchange=contacts;$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('save').onclick=()=>{let amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<0){alert('Montant invalide');return}rows.push({id:crypto.randomUUID(),hotel:$('hotel').value,contact,dest:$('dest').value,vehicle:$('vehicle').value,date:$('date').value,amount,status:$('mode').value==='Direct'?'Effectuée':'Programmée',room:$('room').value,note:$('note').value});persist()};$('reset').onclick=()=>{if(confirm('Effacer uniquement les essais de cette démonstration ?')){rows=[];persist()}};contacts();render();
</script></html>
