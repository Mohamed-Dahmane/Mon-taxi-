<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Taxi — récupération locale</title><style>body{font:16px system-ui;background:#101c2e;color:#fff;padding:20px;max-width:700px;margin:auto}button{padding:14px;border:0;border-radius:10px;background:#4d9cf5;color:#061323;font-weight:700;margin:8px 0}article{padding:12px;margin:10px 0;background:#1e3047;border-radius:10px}small{color:#b9c9dd}strong{color:#b9f6c8}</style></head><body><h1>Mon Taxi — récupération des données Chrome</h1><p>Cette page ne synchronise rien, ne modifie aucune donnée et ne contacte aucun serveur. Ouvrez-la dans le même Chrome que Mon Taxi.</p><p id="status">Lecture locale…</p><div id="results"></div><script>
(function(){'use strict';const keys=['gestion-taxi-test-v3','gestion-taxi-test-v2','gestion-taxi-test-v1','gestion-taxi-before-month-import','gestion-taxi-before-full-import','gestion-taxi-before-last-reset','montaxi:hotel-commissions:courses-v1','montaxi:hotel-commissions:directory-v1'];const results=document.getElementById('results');let found=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('taxi-before-cloud-sync-'))keys.push(k)}}catch(e){document.getElementById('status').textContent='Stockage Chrome inaccessible : '+e.message;return;}for(const key of keys){let raw;try{raw=localStorage.getItem(key)}catch(e){continue}if(!raw)continue;found++;let summary='';try{const d=JSON.parse(raw);if(d&&d.months)summary='Mois enregistrés : '+Object.keys(d.months).length+' ('+Object.keys(d.months).join(', ')+')';else if(Array.isArray(d))summary='Courses : '+d.length;else summary='Données présentes';}catch(e){summary='Format non reconnu';}const article=document.createElement('article');const title=document.createElement('div');title.textContent=key;const info=document.createElement('small');info.textContent=summary+' · '+raw.length+' caractères';const btn=document.createElement('button');btn.textContent='Sauvegarder cette copie';btn.onclick=()=>{const blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mon-taxi-recuperation-'+key.replace(/[^a-z0-9-]/gi,'_')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};article.append(title,info,document.createElement('br'),btn);results.append(article)}document.getElementById('status').textContent=found?found+' sauvegarde(s) locale(s) trouvée(s). Téléchargez les copies disponibles avant toute autre manipulation.':'Aucune des sauvegardes recherchées dans ce profil Chrome. Ne videz pas le stockage.';})();
</script></body></html>
