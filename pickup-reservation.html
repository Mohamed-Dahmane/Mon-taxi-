  const shifts=integrated?.doubleTree

  if(!doubleTree){
    pickupPapaSelected=false
    return
  }
  const time=$("timeMode").value==="arrival"?$("arrival").value:$("time").value
  const contact=shifts.contactForTime(time,pickupPapaSelected?"Papas":"")

  $("pickupPapa").hidden=!shifts.papa
  $("pickupPapa").setAttribute("aria-pressed",String(pickupPapaSelected))

    $("contact").add(new Option(contact,contact))
  }

  $("contactSearch").value=contact
}

}

function setupClock(prefix,field){const h=$(prefix+"Hour"),m=$(prefix+"Minute"),target=$(field);function sync(){let hh=h.value,mm=m.value;if(hh!==""&&mm.length===2&&Number(hh)<24&&Number(mm)<60)target.value=hh.padStart(2,"0")+":"+mm;else target.value="";syncPickupDoubleTreeContact()}h.addEventListener("input",()=>{h.value=h.value.replace(/\D/g,"").slice(0,2);if(h.value.length===2){if(Number(h.value)>23){h.value=h.value[0];}else m.focus()}else if(h.value.length===1&&Number(h.value)>2){h.value=h.value.padStart(2,"0");m.focus()}sync()});m.addEventListener("input",()=>{m.value=m.value.replace(/\D/g,"").slice(0,2);if(m.value.length===2){if(Number(m.value)>59){m.value=m.value[0];return}sync();const fields=[...document.querySelectorAll("#editor input:not([type=hidden]),#editor select,#editor textarea")].filter(x=>x.getClientRects().length);const i=fields.indexOf(m);if(i>=0&&fields[i+1])fields[i+1].focus()}else sync()});h.addEventListener("blur",()=>{if(h.value.length===1)h.value=h.value.padStart(2,"0");sync()});m.addEventListener("blur",sync);return function(v){const parts=(v||"").split(":");h.value=parts[0]||"";m.value=parts[1]||"";sync()}}const setTime=setupClock("time","time"),setArrival=setupClock("arrival","arrival");$("date").addEventListener("input",()=>{if($("date").value)$("timeMode").focus()});$("date").addEventListener("change",()=>{$("timeMode").focus()});document.querySelectorAll("#editor select").forEach(el=>el.addEventListener("change",()=>{if(["hotel","contact","driver","place","destination","timeMode"].includes(el.id)){if(el.id==="hotel")$("contactSearch").focus();else if(el.id==="contact")$("destination").focus();else if(el.id==="driver")$("vehicle").focus();else if(el.id==="place")$("hotelSearch").focus();else if(el.id==="destination")$("driverSearch").focus();else if(el.id==="timeMode"){if(el.value==="fixed")$("timeHour").focus();else $("place").focus()}return;}const fields=[...document.querySelectorAll("#editor input:not([type=hidden]),#editor select,#editor textarea")].filter(x=>x.getClientRects().length);const i=fields.indexOf(el);if(i>=0&&fields[i+1])fields[i+1].focus()}));$("client").addEventListener("input",e=>{let el=e.target,pos=el.selectionStart;el.value=el.value.toLocaleLowerCase("fr").replace(/(^|[\s\-])([\p{L}])/gu,(_,sep,c)=>sep+c.toLocaleUpperCase("fr"));el.setSelectionRange(pos,pos)});$("flight").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());function setupSearch(id,otherId){const select=$(id),input=$(id+"Search"),suggestions=$(id+"Suggestions");const hotelRank=id==="hotel"&&window.parent.TaxiDriverDirectoryCore?.nameSearchRank;

  setTime(p.timeMode==="fixed"?(entry.scheduledTime??entry.recordedTime):"")
  setArrival(p.arrival)
  const kind = Object.keys(pickupPlaces).find(kind => pickupPlaces[kind].includes(p.place)) ?? "other"
  selectPickupKind(kind, p.place)
  $("otherPlace").value = kind === "other" ? p.place : ""
  $("hotelSearch").value=entry.hotel
  $("hotelSearch").dispatchEvent(new Event("blur"))
  $("contactSearch").value=entry.contact
  $("contactSearch").dispatchEvent(new Event("blur"))
  pickupPapaSelected=Boolean(integrated?.doubleTree?.papa)&&integrated.doubleTree.papa===entry.contact
  $("driverSearch").value=entry.driver==="self"?"Moi":entry.driverName
  $("driverSearch").dispatchEvent(new Event("blur"))
  $("destination").value=entry.destination===entry.hotel?"hotel":"other"
  $("destinationOther").value=entry.destination
  $("vehicle").value=entry.vehicleChoice==="Petite voiture"?"Voiture normale":entry.vehicleChoice
  $("vans").value=p.quantity
  $("commissionUnit").value=entry.amount===Math.round(p.commissionUnit*p.quantity*100)/100
    ?p.commissionUnit:Number((entry.amount/p.quantity).toFixed(2))
  $("price").value=entry.announcedPrice??""
  for(const id of ["flight","company","client","phone","passengers","luggage","driverPhone"])$(id).value=p[id]??""
  $("room").value=entry.room??""
  $("notes").value=entry.note??""
  $("reminder60").checked=p.reminder60
  $("reminder30").checked=p.reminder30
  updateWeekday()
  syncOther()
  syncTimeMode()
  updateCommission()
}
if(integrated?.entry){
  loadPickup(integrated.entry)
  $("reset").hidden=true
}
function saveIntegrated(r){
  const message=$("pickupError")
  const price=r.price===""?null:Number(r.price)
  const error=integrated.save({
    date:r.date,time:r.time,timeMode:r.timeMode,arrival:r.arrival,
    place:resolvedName(r,"place","otherPlace").trim(),
    hotel:resolvedName(r,"hotel","otherHotel").trim(),
    contact:resolvedName(r,"contact","otherContact").trim(),
    driver:resolvedName(r,"driver","otherDriver").trim(),
    destination:destinationName(r).trim(),vehicle:r.vehicle,
    quantity:Number(r.vans),commissionUnit:Number(r.commissionUnit),amount:Number(r.commission),price,
    client:r.client.trim(),phone:r.phone.trim(),flight:r.flight.trim(),company:r.company.trim(),
    passengers:Number(r.passengers),luggage:r.luggage.trim(),driverPhone:r.driverPhone.trim(),
    room:r.room.trim(),notes:r.notes.trim(),reminder60:r.reminder60,reminder30:r.reminder30
  })
  if(error){
    message.textContent=error
    message.hidden=false
    message.scrollIntoView({block:"nearest"})
  }
}
function resolvedName(r,key,other){return (r[key]==="Autre"||r[key]==="Autre hôtel / entité")?(r[other]||r[key]):r[key]}function destinationName(r){return r.destination==="other"?(r.destinationOther||"Autre destination"):resolvedName(r,"hotel","otherHotel")}function updateCommission(){let n=Math.max(1,Number($("vans").value)||1),u=Number($("commissionUnit").value)||0;$("commission").value=(n*u).toFixed(2);$("commissionExplain").textContent=n+" × "+u.toFixed(2)+" € par "+($("vehicle").value==="Van"?"van":"véhicule")+" = "+(n*u).toFixed(2)+" € au total"}$("commissionUnit").addEventListener("input",updateCommission);$("vans").addEventListener("input",updateCommission);function refreshCommissionDefault(){
  $("commissionUnit").value=(Number(commissionDefault())/Math.max(1,Number($("vans").value)||1)).toFixed(2)
  updateCommission()
}
function commissionDefault(){
  const hotel=$("hotel").value
  const place=$("place").value
  const vehicle=$("vehicle").value
  const isDoubleTree=hotel==="DoubleTree"||hotel==="DoubleTree by Hilton"
  const isMarriott=hotel==="Marriott Bourse"||hotel==="Marriott Hotel (Bourse)"
  const per=place.includes("CRL")?(isDoubleTree?20:25):(isDoubleTree||isMarriott||vehicle!=="Van"?10:15)
  return (per*(Number($("vans").value)||1)).toFixed(2)
}
function focusPickupField(id) {
  const field = $(id)
  const details = field.closest("details")
  if (details) details.open = true
  field.focus()
}
$("save").onclick=()=>{if(!integrated)return;for(const id of ["hotel","contact","driver"]){$(id+"Search").dispatchEvent(new Event("change"))}syncPickupDoubleTreeContact();let r={};ids.forEach(id=>r[id]=$(id).value);updateCommission();r.commission=$("commission").value;r.reminder60=$("reminder60").checked;r.reminder30=$("reminder30").checked;if(!/^[1-9]\d*$/.test(String(r.vans).trim())||!Number.isSafeInteger(Number(r.vans))){alert("Indique un nombre entier de véhicules supérieur à zéro.");focusPickupField("vans");return}if(!Number.isFinite(Number(r.commissionUnit))||Number(r.commissionUnit)<0||!/^\d+(?:\.\d{1,2})?$/.test(String(r.commissionUnit).trim())){alert("La commission par véhicule doit être un montant positif ou 0 €, avec deux décimales maximum.");focusPickupField("commissionUnit");return}if(!r.date||(r.timeMode==="arrival"?!r.arrival:!r.time)){alert("Date et heure obligatoires");return}if(r.contact==="Autre"&&!r.otherContact.trim()){alert("Indique le nom du contact.");return}if(r.destination==="other"&&!r.destinationOther.trim()){alert("Précise la destination.");focusPickupField("destinationOther");return}if(r.hotel==="Autre hôtel / entité"&&!r.otherHotel.trim()){alert("Précise qui attribue la course.");return}if(parent.TaxiDriverCommunication?.canAssignName(resolvedName(r,"driver","otherDriver"),pickupDriverCourse())===false){alert("Ce chauffeur ne correspond pas au véhicule. Choisis un chauffeur compatible dans le répertoire.");$("driverSearch").focus();return}if(!r.flight.trim()){alert(pickupKind==="station"?"Indique le numéro de train.":pickupKind==="airport"?"Indique le numéro de vol.":"Indique le numéro de vol ou de train.");$("flight").focus();return}const required=[["hotel","Course attribuée par"],["contact","Nom du contact"],["driver","Chauffeur"],["place","Lieu"],["destination","Destination"],["vehicle","Type de véhicule"],["vans","Nombre de véhicules"],["passengers","Nombre de passagers"],["commissionUnit","Commission par véhicule"]];for(const [id,label] of required){if(!String(r[id]||"").trim()||(id==="vans"||id==="passengers")&&Number(r[id])<1){alert("Champ obligatoire : "+label);focusPickupField(id==="hotel"?"hotelSearch":id==="contact"?"contactSearch":id==="driver"?"driverSearch":id);return}}if(r.place==="Autre"&&!r.otherPlace.trim()){alert("Précise le lieu.");$("otherPlace").focus();return}if(r.driver==="Autre"&&!r.otherDriver.trim()){alert("Indique le chauffeur.");$("driverSearch").focus();return}if(integrated.mode==="Réservation"&&r.timeMode==="arrival"&&!r.arrival){alert("Indique l’heure d’arrivée.");$("arrivalHour").focus();return}if(r.timeMode==="arrival")r.time=r.arrival;for (const id of ["vans","passengers","commissionUnit","price"]) {
    if ($(id).validity.valid) continue
    focusPickupField(id)
    $(id).reportValidity()
    return
  }
  const quantity=Number(r.vans),unit=Number(r.commissionUnit);
  const confirmation="Valider les véhicules avant d'enregistrer le pick-up ?\\n\\n"+
    quantity+" × "+r.vehicle+"\\n"+
    "Chauffeur : "+resolvedName(r,"driver","otherDriver")+"\\n"+
    "Commission : "+unit.toFixed(2)+" € par véhicule\\n"+
    "Total : "+(quantity*unit).toFixed(2)+" €\\n\\n"+
    "Annuler permet de modifier les informations.";
  if(!window.confirm(confirmation))return;
  saveIntegrated(r)
}

if(!integrated){
  $("save").disabled=true

function syncCompatibleDrivers(){
 if(!integrated||!parent.TaxiDriverCommunication)return;
 const previous=$("driver").value;const values=["Moi",...parent.TaxiDriverCommunication.namesForCourse(pickupDriverCourse())];
 options($("driver"),[...values,"Autre"]);$("driver").value=values.includes(previous)?previous:"";$("driverSearch").value=$("driver").value;
 $("driverSuggestions").replaceChildren(...values.map(name=>new Option(name,name)));
