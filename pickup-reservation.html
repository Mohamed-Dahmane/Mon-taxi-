<main><header><h1>Pick-up</h1></header><div id="editor" class="booking-form"><section><h2>Course</h2><div class="grid"><div><label>Date</label><input id="date" type="hidden"><button type="button" class="secondary" id="dateChoose">Choisir une date</button><div id="calendar" class="hidden"></div><input id="dateUnused" type="hidden"><div id="weekday" class="muted" aria-live="polite"></div></div><div><label for="timeMode">Heure de prise en charge</label><select id="timeMode"><option value="fixed">Heure fixe</option><option value="arrival">Voir arrivée vol / train (Flight / Train Tracking)</option></select></div><div id="timeWrap"><label>Heure fixée</label><input id="time" type="hidden"><div class="clock"><input id="timeHour" inputmode="numeric" maxlength="2" placeholder="HH" aria-label="Heure"><span>:</span><input id="timeMinute" inputmode="numeric" maxlength="2" placeholder="MM" aria-label="Minutes"></div></div><div><label for="place">Lieu aéroport / gare</label><select id="place"><option>Bruxelles Aéroport (BRU)</option><option>Charleroi Airport (CRL)</option><option>Gare du Midi</option><option>Gare du Nord</option><option>Gare Centrale</option><option>Autre</option></select></div><div id="otherPlaceWrap" class="hidden"><label for="otherPlace">Préciser le lieu</label><input id="otherPlace" placeholder="Saisir le lieu d’arrivée ou de départ"></div><div><label for="hotelSearch">Course attribuée par</label><input id="hotelSearch" list="hotelSuggestions" placeholder="Rechercher un hôtel ou saisir un nom" autocomplete="off"><datalist id="hotelSuggestions"></datalist><div id="hotelMatches" class="hidden" role="group" aria-label="Hôtels correspondant à la recherche"></div><select id="hotel" class="hidden"><option>DoubleTree</option><option>The Standard</option><option>NH Collection (Atlanta)</option><option>Nhow (Bloom)</option><option>Thon Hotel (Rogier)</option><option>Marriott Hotel (Bourse)</option><option>Thon Hotel EU</option><option>Marriott Joseph II</option><option>Cardo</option><option>Aloft</option><option>Moxy</option><option>The Hotel</option><option>Autre hôtel / entité</option></select></div><div id="otherHotelWrap" class="hidden"><label for="otherHotel">Nom de l’hôtel ou de l’entité</label><input id="otherHotel" placeholder="Hôtel, société, personne…"></div><div><label for="contactSearch">Nom du contact qui attribue *</label><input id="contactSearch" list="contactSuggestions" placeholder="Rechercher ou saisir un contact" autocomplete="off"><datalist id="contactSuggestions"></datalist><select id="contact" class="hidden"></select></div><div id="otherContactWrap" class="hidden"><label for="otherContact">Nom du contact</label><input id="otherContact" placeholder="Saisir le contact"></div><div><label for="destination">Destination</label><select id="destination"><option value="hotel">Hôtel (DoubleTree, The Standard ou autre)</option><option value="other">Autre lieu (saisie libre)</option></select></div><div id="destinationOtherWrap" class="hidden"><label for="destinationOther">Adresse / destination</label><input id="destinationOther" placeholder="Nom ou adresse de destination"></div><div><label for="driverSearch">Chauffeur attribué</label><input id="driverSearch" list="driverSuggestions" placeholder="Rechercher ou saisir un chauffeur" autocomplete="off"><datalist id="driverSuggestions"></datalist><select id="driver" class="hidden"><option>Moi</option><option>Hassan</option><option>Tanjaoui</option><option>Pit</option><option>Yassine</option><option>Hadib</option><option>Mehdi</option><option>Alexis</option><option>Marrakchi</option><option>Claquette</option><option>Nabil Claquette</option><option>Hicham Diaz</option><option>Karim Diaz</option><option>Kawa</option><option>Chapour</option><option>Fouad Renaissance</option><option>Mohamed 70</option><option>Crabe</option><option>Autre</option></select></div><div><label for="otherDriver">Autre chauffeur</label><input id="otherDriver" placeholder="Nom libre"></div><div><label for function setupClock(prefix,field){const h=$(prefix+"Hour"),m=$(prefix+"Minute"),target=$(field);function sync(){let hh=h.value,mm=m.value;if(hh!==""&&mm.length===2&&Number(hh)<24&&Number(mm)<60)target.value=hh.padStart(2,"0")+":"+mm;else target.value=""}h.addEventListener("input",()=>{h.value=h.value.replace(/\D/g,"").slice(0,2);if(h.value.length===2){if(Number(h.value)>23){h.value=h.value[0];}else m.focus()}else if(h.value.length===1&&Number(h.value)>2){h.value=h.value.padStart(2,"0");m.focus()}sync()});m.addEventListener("input",()=>{m.value=m.value.replace(/\D/g,"").slice(0,2);if(m.value.length===2){if(Number(m.value)>59){m.value=m.value[0];return}sync();const fields=[...document.querySelectorAll("#editor input:not([type=hidden]),#editor select,#editor textarea")].filter(x=>!x.closest(".hidden"));const i=fields.indexOf(m);if(i>=0&&fields[i+1])fields[i+1].focus()}else sync()});h.addEventListener("blur",()=>{if(h.value.length===1)h.value=h.value.padStart(2,"0");sync()});m.addEventListener("blur",sync);return function(v){const parts=(v||"").split(":");h.value=parts[0]||"";m.value=parts[1]||"";sync()}}const setTime=setupClock("time","time"),setArrival=setupClock("arrival","arrival");$("date").addEventListener("input",()=>{if($("date").value)$("timeMode").focus()});$("date").addEventListener("change",()=>{$("timeMode").focus()});document.querySelectorAll("#editor select").forEach(el=>el.addEventListener("change",()=>{if(["hotel","contact","driver","place","destination","timeMode"].includes(el.id)){if(el.id==="hotel")$("contactSearch").focus();else if(el.id==="contact")$("destination").focus();else if(el.id==="driver")$("vehicle").focus();else if(el.id==="place")$("hotelSearch").focus();else if(el.id==="destination")$("driverSearch").focus();else if(el.id==="timeMode"){if(el.value==="fixed")$("timeHour").focus();else $("place").focus()}return;}const fields=[...document.querySelectorAll("#editor input:not([type=hidden]),#editor select,#editor textarea")].filter(x=>!x.closest(".hidden"));const i=fields.indexOf(el);if(i>=0&&fields[i+1])fields[i+1].focus()}));$("client").addEventListener("input",e=>{let el=e.target,pos=el.selectionStart;el.value=el.value.toLocaleLowerCase("fr").replace(/(^|[\s\-])([\p{L}])/gu,(_,sep,c)=>sep+c.toLocaleUpperCase("fr"));el.setSelectionRange(pos,pos)});$("flight").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());function setupSearch(id,otherId){const select=$(id),input=$(id+"Search"),suggestions=$(id+"Suggestions");const hotelRank=id==="hotel"&&window.parent.TaxiDriverDirectoryCore?.nameSearchRank;
const matches=hotelRank?$("hotelMatches"):null;
if(matches)input.removeAttribute("list");
function options(){return [...select.options].filter(o=>o.value&&o.value!=="Autre"&&o.value!=="Autre hôtel / entité").map(o=>o.value)}function refresh(){suggestions.replaceChildren(...options().map(v=>{let o=document.createElement("option");o.value=v;return o}))}function commit(advance=false){const previousValue=select.value;const typed=input.value.trim();const match=options().find(v=>v.toLocaleLowerCase("fr")===typed.toLocaleLowerCase("fr"));if(match){select.value=match;$(otherId).value="";input.value=match}else if(typed){select.value=id==="hotel"?"Autre hôtel / entité":"Autre";$(otherId).value=typed}else{if(id==="hotel")select.selectedIndex=-1;else if(select.options.length)select.selectedIndex=0;input.value=select.value==="Autre"?"":select.value}if(id==="hotel"&&(!integrated||select.value!==previousValue)){refreshContacts();$("contactSearch").value=$("contact").value==="Autre"?"":$("contact").value;if(!edit)refreshCommissionDefault()}syncOther();if(advance&&typed){const next={hotel:"contactSearch",contact:"destination",driver:"vehicle"}[id];if(next)$(next).focus()}}if(matches){
  function updateMatches(){
    const query=input.value.trim();
    const ranked=query?options().map(name=>({name,rank:hotelRank(name,query)})).filter(item=>item.rank>=0).sort((a,b)=>a.rank-b.rank):[];
    matches.replaceChildren(...ranked.map(({name})=>{
      const button=document.createElement("button");
      button.type="button";button.className="secondary";button.textContent=name;
      button.onclick=()=>{input.value=name;matches.classList.add("hidden");commit(true)};
      return button;
    }));
    matches.classList.toggle("hidden",!ranked.length);
  }
  input.addEventListener("focus",updateMatches);
  input.addEventListener("input",updateMatches);
  input.addEventListener("change",()=>commit(false));
  input.addEventListener("blur",event=>{
    if(!matches.contains(event.relatedTarget)){matches.classList.add("hidden");commit(false)}
  });
  matches.addEventListener("pointerdown",event=>{if(event.pointerType==="mouse")event.preventDefault()});
  matches.addEventListener("focusout",event=>{
    if(event.relatedTarget!==input&&!matches.contains(event.relatedTarget)){matches.classList.add("hidden");commit(false)}
  });
  input.addEventListener("keydown",event=>{
    if(event.isComposing||matches.classList.contains("hidden"))return;
    if(event.key==="Escape"){event.preventDefault();matches.classList.add("hidden")}
    if(event.key==="ArrowDown"){event.preventDefault();matches.firstElementChild?.focus()}
    if(event.key==="Enter"&&matches.childElementCount===1){event.preventDefault();matches.firstElementChild.click()}
  });
  return ()=>{input.value="";updateMatches()};
}
input.addEventListener("focus",refresh);input.addEventListener("input",()=>{const typed=input.value.trim();const match=options().find(v=>v.toLocaleLowerCase("fr")===typed.toLocaleLowerCase("fr"));if(match)commit(true)});input.addEventListener("change",()=>commit(true));input.addEventListener("blur",()=>commit(false));return ()=>{input.value="";refresh()}}const clearHotelSearch=setupSearch("hotel","otherHotel"),clearContactSearch=setupSearch("contact","otherContact"),clearDriverSearch=setupSearch("driver","otherDriver");
let calendarMonth=new Date();function drawCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();let html='<div class="cal-nav"><button type="button" data-cal="prev">‹</button><strong>'+new Date(y,m,1).toLocaleDateString("fr-BE",{month:"long",year:"numeric"})+'</strong><button type="button" data-cal="next">›</button></div><div class="days">';for(const w of ["Lu","Ma","Me","Je","Ve","Sa","Di"])html+='<span>'+w+'</span>';for(let i=0;i<first;i++)html+='<span></span>';for(let d=1;d<=last;d++)html+='<button type="button" data-day="'+d+'" class="'+(($("date").value===y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"))?"selected":"")+'">'+d+'</button>';$("calendar").innerHTML=html+"</div>"}$("dateChoose").onclick=()=>{calendarMonth=new Date(($("date").value||new Date().toISOString().slice(0,10))+"T12:00:00");drawCalendar();$("calendar").classList.toggle("hidden")};$("calendar").onclick=e=>{const btn=e.target.closest("button");if(!btn)return;if(btn.dataset.cal){calendarMonth.setMonth(calendarMonth.getMonth()+(btn.dataset.cal==="next"?1:-1));drawCalendar();return}if(btn.dataset.day){const d=Number(btn.dataset.day);$("date").value=calendarMonth.getFullYear()+"-"+String(calendarMonth.getMonth()+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");$("dateChoose").textContent=shortDate($("date").value);$("calendar").classList.add("hidden");updateWeekday();$("timeMode").focus()}};
function shortDate(value){const d=new Date(value+"T12:00:00");if(Number.isNaN(d.getTime()))return "";const day=d.toLocaleDateString("fr-BE",{weekday:"long"});const month=d.getMonth()===8?"septembre":d.toLocaleDateString("fr-BE",{month:"short"}).replace(/\.$/,"")+". ";return day.charAt(0).toUpperCase()+day.slice(1)+" "+d.getDate()+" "+month.trim()+" "+d.getFullYear()}function updateWeekday(){let d=$("date").value;$("weekday").textContent=d?new Date(d+"T12:00:00").toLocaleDateString("fr-BE",{weekday:"long"}):""} $("date").addEventListener("change",updateWeekday);function syncOther(){ $("otherPlaceWrap").classList.toggle("hidden",$("place").value!=="Autre");$("otherHotelWrap").classList.toggle("hidden",Boolean(integrated)||$("hotel").value!=="Autre hôtel / entité");$("destinationOtherWrap").classList.toggle("hidden",$("destination").value!=="other");$("otherContactWrap").classList.toggle("hidden",Boolean(integrated)||$("contact").value!=="Autre");$("otherDriver").parentElement.classList.toggle("hidden",Boolean(integrated)||$("driver").value!=="Autre")} ["place","hotel","destination","contact","driver"].forEach(id=>$(id).addEventListener("change",syncOther));function syncTimeMode(){let follow=$("timeMode").value==="arrival";$("timeWrap").classList.toggle("hidden",follow);$("arrival").required=follow;$("time").required=!follow} $("timeMode").onchange=syncTimeMode;function refreshContacts(){let v=$("contact").value;let a=integrated?.contacts[$("hotel").value]||[]; options($("contact"),[...a,"Autre"]);if(a.includes(v))$("contact").value=v;else $("contact").value=a.length?a[0]:"Autre";syncOther()} $("hotel").addEventListener("change",refreshContacts);refreshContacts();function reset(){edit=null;if(integrated)$("pickupError").hidden=true;ids.forEach(id=>{let el=$(id);if(el.tagName==="INPUT"||el.tagName==="TEXTAREA")el.value="";else el.selectedIndex=0});$("date").value=integrated?.today??new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);setTime("00:00");setArrival("");$("commission").value="10";$("passengers").value="1";$("vans").value="1";$("commissionUnit").value="10";$("reminder60").checked=true;$("reminder30").checked=true;$("hotel").selectedIndex=-1;refreshContacts();clearHotelSearch();clearContactSearch();clearDriverSearch();$("dateChoose").textContent=shortDate($("date").value);syncTimeMode();syncOther();updateWeekday();$("commissionUnit").value=(Number(commissionDefault())/Math.max(1,Number($("vans").value)||1)).toFixed(2);updateCommission()}for(const id of ["vans","passengers"]){$(id).addEventListener("focus",e=>e.target.select());$(id).addEventListener("click",e=>e.target.select())}reset();["place","vehicle"].forEach(id=>$(id).addEventListener("change",()=>{if(!edit)refreshCommissionDefault()}));function loadPickup(entry){
  const p=entry.pickup
  edit=entry.id
  $("date").value=entry.scheduledDate??entry.date
  $("dateChoose").textContent=shortDate($("date").value)
  $("timeMode").value=p.timeMode
  setTime(p.timeMode==="fixed"?(entry.scheduledTime??entry.recordedTime):"")
  setArrival(p.arrival)
  const isKnownPlace=[...$("place").options].some(option=>option.value===p.place&&p.place!=="Autre")
  $("place").value=isKnownPlace?p.place:"Autre"
  $("otherPlace").value=isKnownPlace?"":p.place
  $("hotelSearch").value=entry.hotel
  $("hotelSearch").dispatchEvent(new Event("blur"))
  $("contactSearch").value=entry.contact
  $("contactSearch").dispatchEvent(new Event("blur"))
  $("driverSearch").value=entry.driver==="self"?"Moi":entry.driverName
  $("driverSearch").dispatchEvent(new Event("blur"))
  $("destination").value=entry.destination===entry.hotel?"hotel":"other"
  $("destinationOther").value=entry.destination
  $("vehicle").value=entry.vehicleChoice==="Petite voiture"?"Voiture normale":entry.vehicleChoice
  $("vans").value=p.quantity
  $("commissionUnit").value=entry.amount===Math.round(p.commissionUnit*p.quantity*100)/100
    ?p.commissionUnit:Number((entry.amount/p.quantity).toFixed(2))
  $("price").value=entry.announcedPrice??""
  for(const id of ["flight","company","client","phone","passengers","luggage","driverPhone"])$(id).value=p[id]??""
  $("room").value=entry.room??""
  $("notes").value=entry.note??""
  $("reminder60").checked=p.reminder60
  $("reminder30").checked=p.reminder30
  updateWeekday()
  syncOther()
  syncTimeMode()
  updateCommission()
}
if(integrated?.entry){
  loadPickup(integrated.entry)
  $("reset").hidden=true
}
function saveIntegrated(r){
  const message=$("pickupError")
  const price=r.price===""?null:Number(r.price)
  const error=integrated.save({
    date:r.date,time:r.time,timeMode:r.timeMode,arrival:r.arrival,
    place:resolvedName(r,"place","otherPlace").trim(),
    hotel:resolvedName(r,"hotel","otherHotel").trim(),
    contact:resolvedName(r,"contact","otherContact").trim(),
    driver:resolvedName(r,"driver","otherDriver").trim(),
    destination:destinationName(r).trim(),vehicle:r.vehicle,
    quantity:Number(r.vans),commissionUnit:Number(r.commissionUnit),amount:Number(r.commission),price,
    client:r.client.trim(),phone:r.phone.trim(),flight:r.flight.trim(),company:r.company.trim(),
    passengers:Number(r.passengers),luggage:r.luggage.trim(),driverPhone:r.driverPhone.trim(),
    room:r.room.trim(),notes:r.notes.trim(),reminder60:r.reminder60,reminder30:r.reminder30
  })
  if(error){
    message.textContent=error
    message.hidden=false
    message.scrollIntoView({block:"nearest"})
  }
}
function resolvedName(r,key,other){return (r[key]==="Autre"||r[key]==="Autre hôtel / entité")?(r[other]||r[key]):r[key]}function destinationName(r){return r.destination==="other"?(r.destinationOther||"Autre destination"):resolvedName(r,"hotel","otherHotel")}function updateCommission(){let n=Math.max(1,Number($("vans").value)||1),u=Number($("commissionUnit").value)||0;$("commission").value=(n*u).toFixed(2);$("commissionExplain").textContent=n+" × "+u.toFixed(2)+" € par "+($("vehicle").value==="Van"?"van":"véhicule")+" = "+(n*u).toFixed(2)+" € au total"}$("commissionUnit").addEventListener("input",updateCommission);$("vans").addEventListener("input",updateCommission);function refreshCommissionDefault(){
  $("commissionUnit").value=(Number(commissionDefault())/Math.max(1,Number($("vans").value)||1)).toFixed(2)
  updateCommission()
}
function commissionDefault(){
  const hotel=$("hotel").value
  const place=$("place").value
  const vehicle=$("vehicle").value
  const isDoubleTree=hotel==="DoubleTree"||hotel==="DoubleTree by Hilton"
  const isMarriott=hotel==="Marriott Bourse"||hotel==="Marriott Hotel (Bourse)"
  const per=place.includes("CRL")?(isDoubleTree?20:25):(isDoubleTree||isMarriott||vehicle!=="Van"?10:15)
  return (per*(Number($("vans").value)||1)).toFixed(2)
}
$("save").onclick=()=>{if(!integrated)return;for(const id of ["hotel","contact","driver"]){$(id+"Search").dispatchEvent(new Event("change"))}let r={};ids.forEach(id=>r[id]=$(id).value);updateCommission();r.commission=$("commission").value;r.reminder60=$("reminder60").checked;r.reminder30=$("reminder30").checked;if(!/^[1-9]\d*$/.test(String(r.vans).trim())||!Number.isSafeInteger(Number(r.vans))){alert("Indique un nombre entier de véhicules supérieur à zéro.");$("vans").focus();return}if(!Number.isFinite(Number(r.commissionUnit))||Number(r.commissionUnit)<0||!/^\d+(?:\.\d{1,2})?$/.test(String(r.commissionUnit).trim())){alert("La commission par véhicule doit être un montant positif ou 0 €, avec deux décimales maximum.");$("commissionUnit").focus();return}if(!r.date||(r.timeMode==="arrival"?!r.arrival:!r.time)){alert("Date et heure obligatoires");return}if(r.contact==="Autre"&&!r.otherContact.trim()){alert("Indique le nom du contact.");return}if(r.destination==="other"&&!r.destinationOther.trim()){alert("Précise la destination.");return}if(r.hotel==="Autre hôtel / entité"&&!r.otherHotel.trim()){alert("Précise qui attribue la course.");return}if(parent.TaxiDriverCommunication?.canAssignName(resolvedName(r,"driver","otherDriver"),pickupDriverCourse())===false){alert("Ce chauffeur ne correspond pas au véhicule. Choisis un chauffeur compatible dans le répertoire.");$("driverSearch").focus();return}if(!r.flight.trim()){alert("Indique le numéro de vol ou de train.");$("flight").focus();return}const required=[["hotel","Course attribuée par"],["contact","Nom du contact"],["driver","Chauffeur"],["place","Lieu"],["destination","Destination"],["vehicle","Type de véhicule"],["vans","Nombre de véhicules"],["passengers","Nombre de passagers"],["commissionUnit","Commission par véhicule"]];for(const [id,label] of required){if(!String(r[id]||"").trim()||(id==="vans"||id==="passengers")&&Number(r[id])<1){alert("Champ obligatoire : "+label);$(id==="hotel"?"hotelSearch":id==="contact"?"contactSearch":id==="driver"?"driverSearch":id).focus();return}}if(r.place==="Autre"&&!r.otherPlace.trim()){alert("Précise le lieu.");$("otherPlace").focus();return}if(r.driver==="Autre"&&!r.otherDriver.trim()){alert("Indique le chauffeur.");$("driverSearch").focus();return}if(integrated.mode==="Réservation"&&r.timeMode==="arrival"&&!r.arrival){alert("Indique l’heure d’arrivée.");$("arrivalHour").focus();return}if(r.timeMode==="arrival")r.time=r.arrival;if(!["vans","passengers","commissionUnit","price"].every(id=>$(id).reportValidity()))return
  const quantity=Number(r.vans),unit=Number(r.commissionUnit);
  const confirmation="Valider les véhicules avant d'enregistrer le pick-up ?\\n\\n"+
    quantity+" × "+r.vehicle+"\\n"+
    "Chauffeur : "+resolvedName(r,"driver","otherDriver")+"\\n"+
    "Commission : "+unit.toFixed(2)+" € par véhicule\\n"+
    "Total : "+(quantity*unit).toFixed(2)+" €\\n\\n"+
    "Annuler permet de modifier les informations.";
  if(!window.confirm(confirmation))return;
  saveIntegrated(r)
}
$("reset").onclick=reset
if(!integrated){
  $("save").disabled=true
  $("pickupError").textContent="Pour enregistrer une course, ouvre ce formulaire depuis Mon Taxi."
  $("pickupError").hidden=false
}
function pickupDriverCourse(){const vehicle=$("vehicle").value;const count=Number($("vans").value)||1;return {vehicleChoice:vehicle,vehicle,carCount:vehicle==="Voiture normale"?count:0,vanCount:vehicle==="Van"?count:0};}
function syncCompatibleDrivers(){
 if(!integrated||!parent.TaxiDriverCommunication)return;
 const previous=$("driver").value;const values=["Moi",...parent.TaxiDriverCommunication.namesForCourse(pickupDriverCourse())];
 options($("driver"),[...values,"Autre"]);$("driver").value=values.includes(previous)?previous:"";$("driverSearch").value=$("driver").value;
 $("driverSuggestions").replaceChildren(...values.map(name=>new Option(name,name)));
}
$("vehicle").addEventListener("change",syncCompatibleDrivers);
const chooseFromDirectory=document.createElement("button");chooseFromDirectory.type="button";chooseFromDirectory.className="secondary";chooseFromDirectory.textContent="Choisir dans le répertoire";
chooseFromDirectory.onclick=()=>parent.openTaxiDrivers(pickupDriverCourse(),{onSelect:driver=>{
 const name=parent.TaxiDriverDirectoryCore.driverSearchName(driver.name)||driver.name;
 syncCompatibleDrivers();if(![...$("driver").options].some(option=>option.value===name))$("driver").add(new Option(name,name));$("driver").value=name;$("driverSearch").value=name;return true;
}});
if(integrated){$("driverSearch").insertAdjacentElement("afterend",chooseFromDirectory);syncCompatibleDrivers();}
