name: Tests calculs SumUp (sans données privées)
on:
  push:
    paths:
      - 'integrations/sumup-reconciliation.js'
      - 'integrations/sumup-reconciliation.test.mjs'
      - '.github/workflows/sumup-calculation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester rapprochement sans accès SumUp
        run: node integrations/sumup-reconciliation.test.mjs
