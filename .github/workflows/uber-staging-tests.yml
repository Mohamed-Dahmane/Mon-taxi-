name: Uber staging unit tests (isolated)
on:
  push:
    branches: [feature/uber-driver-earnings-staging]
    paths:
      - 'uber-staging/**'
      - '.github/workflows/uber-staging-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalize-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated Uber normalizer tests
        run: node --experimental-strip-types --test uber-staging/normalize-uber-event.test.mts
