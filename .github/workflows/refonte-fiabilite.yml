        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),path=require('node:path');
          const read=p=>fs.readFileSync(p,'utf8');
          const removed=[".github/workflows/sumup-sync.yml",".github/workflows/sumup-connection-check.yml",".github/workflows/sumup-calculation-tests.yml",".github/workflows/sumup-security-tests.yml","supabase/functions/taxi-sumup-sync/index.ts","integrations/sumup-sync-contract.test.mjs","tests/test_sumup_security.py","tests/test_sumup_security_contract.py"];
          for(const p of removed)assert.equal(fs.existsSync(p),false,p);
          for(const name of fs.readdirSync('.github/workflows')){
            if(name.startsWith('refonte-'))continue;
            const s=read(path.join('.github/workflows',name));
            assert.doesNotMatch(s,/api\.sumup\.com|functions\/v1\/taxi-sumup-sync|SUMUP_API_KEY/,name);
            // Android build contains the table name only in negative assertions on packaged assets.
            const executable=s.split('\n').filter(line=>name!=='android-apk.yml'||(!line.trim().startsWith('! grep -rE ')&&!line.trim().startsWith('for forbidden in ('))).join('\n');
            assert.doesNotMatch(executable,/taxi_sumup_transactions/,name);
          }
          const scan=p=>fs.statSync(p).isDirectory()?fs.readdirSync(p).flatMap(n=>scan(path.join(p,n))):[p];
          for(const p of [...scan('refonte'),...scan('app/src/main/java')].filter(p=>/\.(js|html|java)$/.test(p))){
            const source=read(p);
            assert.doesNotMatch(source,/transactions\/history|taxi_sumup_transactions|loadPrivatePayments|taxi-sumup-sync|SUMUP_API_KEY/,p);
            if(p==='app/src/main/java/be/montaxi/gestion/MainActivity.java'){
              // Allow exactly two fixed, read-only API requests in the dedicated reconciliation helper.
              const start=source.indexOf('// Read-only reconciliation;'),end=source.indexOf('private void ackSumUp(');
              assert.ok(start>=0&&end>start);
              const lookup=source.slice(start,end);
              assert.doesNotMatch(source.slice(0,start)+source.slice(end),/api\.sumup\.com/);
              assert.equal((lookup.match(/api\.sumup\.com/g)||[]).length,1);
              assert.deepEqual([...lookup.matchAll(/sumUpRead\("([^"]+)"/g)].map(x=>x[1]),['/v0.1/me','/v2.1/merchants/']);
              assert.match(lookup,/\/transactions\?foreign_transaction_id=/);
              assert.match(lookup,/setRequestMethod\("GET"\)/);
              assert.match(lookup,/setInstanceFollowRedirects\(false\)/);
              assert.doesNotMatch(lookup,/SumUpAPI\.checkout|\.getOutputStream\(|setDoOutput\(true\)|\.putString\("pending"/);
            }else if(p==='app/src/main/java/be/montaxi/gestion/TaxiReceiptOAuthClient.java'){
              // Only the fixed browser authorization host is allowed; network requests go to the dedicated receipt service.
              const authority='"api.sumup.com".equals(uri.getEncodedAuthority())';
              assert.equal(source.split(authority).length,2,p);
              assert.doesNotMatch(source.replace(authority,''),/api\.sumup\.com/,p);
              assert.match(source,/ENDPOINT="https:\/\/uenyvsiturkihectolxp\.supabase\.co\/functions\/v1\/taxi-sumup-oauth"/);
              assert.match(source,/new URL\(ENDPOINT\)\.openConnection\(\)/);
              assert.match(source,/setInstanceFollowRedirects\(false\)/);
              assert.match(source,/"\/authorize"\.equals\(uri\.getPath\(\)\)/);
              assert.match(source,/"transactions\.history user\.profile_readonly"\.equals\(uri\.getQueryParameter\("scope"\)\)/);
              assert.deepEqual([...source.matchAll(/\.put\("action","([^"]+)"\)/g)].map(x=>x[1]).sort(),['receipt','start','status']);
              assert.doesNotMatch(source,/SumUpAPI\.checkout|\/payments|\/refunds|client_secret/);
            }else assert.doesNotMatch(source,/api\.sumup\.com/,p);
          }
          const create=require('./refonte/course-controller.js'),c=create();
          c.plan({id:'local'});c.load('local');c.start('local');c.finish('local');
          assert.throws(()=>c.receiveSumUp('local',{status:'success',attemptId:'foreign',transactionCode:'UNSOLICITED',amountCents:5000,currency:'EUR'}));
          c.beginSumUp('local',5000,'local-attempt');
          assert.throws(()=>c.receiveSumUp('local',{status:'success',attemptId:'foreign',transactionCode:'UNSOLICITED',amountCents:5000,currency:'EUR'}));
          assert.equal(c.snapshot().ledger.length,0);
          c.receiveSumUp('local',{status:'success',attemptId:'local-attempt',transactionCode:'LOCAL-TEST',amountCents:5000,currency:'EUR'});
          assert.equal(c.snapshot().ledger.length,1);assert.equal(c.snapshot().ledger[0].reference,'LOCAL-TEST');
          assert.throws(()=>c.receiveSumUp('local',{status:'success',attemptId:'local-attempt',transactionCode:'LOCAL-TEST',amountCents:5000,currency:'EUR'}));
          const verified=create();verified.plan({id:'verified'});verified.load('verified');verified.start('verified');verified.finish('verified');
          verified.beginSumUp('verified',100,'unique-attempt');
          verified.receiveSumUp('verified',{status:'declined',attemptId:'unique-attempt',transactionCode:'TEST-FAILED',amountCents:100,currency:'EUR',verifiedBy:'sumup_transactions_api'});
          assert.equal(verified.snapshot().ledger.length,0);assert.equal(verified.snapshot().courses[0].status,'awaiting_payment');
          assert.equal(verified.snapshot().courses[0].lastPaymentAttempt.reference,'TEST-FAILED');
