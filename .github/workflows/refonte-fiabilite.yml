name: Fiabilité globale Mon Taxi - refonte
on:
  push:
    branches: [test/forfait-aeroport-6480-20261126]
    paths: ['refonte/**', 'app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      compile_apk:
        description: 'Autoriser explicitement la compilation signée après audit'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clean-data-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Règle bloquante - aucune reprise implicite des données anciennes
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const core=require('./refonte/clean-core.js'),create=require('./refonte/course-controller.js');
          const clean=core.empty();
          for(const [key,value] of Object.entries(clean)) {
            assert.ok(value && typeof value==='object',key);
            assert.equal(Object.keys(value).length,0,key+' doit commencer vide');
          }
          assert.deepEqual(create().snapshot(),clean);
          const source=fs.readFileSync('refonte/course-ui.js','utf8');
          const boundary=source.indexOf('let controller,');
          assert.ok(boundary>0,'Adaptateur de stockage à réauditer');
          const prefix=source.slice(0,boundary);
          const freshKey='mon-taxi-android-refonte:v1';
          const legacy=JSON.stringify({hotels:[{name:'ANCIEN HOTEL'}],contacts:[{name:'ANCIEN CONTACT'}],drivers:[{name:'ANCIEN CHAUFFEUR'}],courses:[{id:'old'}],destinations:['ANCIEN LIEU'],monuments:['ANCIEN MONUMENT'],administrations:['ANCIENNE ADMINISTRATION'],entries:{old:999}});
          const oldKeys=['taxi_management_backups','taxi_hotel_sync','taxi_sumup_transactions','mon-taxi','hotels','contacts','drivers','courses','destinations','monuments','administrations','entries'];
          const values=new Map(oldKeys.map(k=>[k,legacy]));
          const reads=[],writes=[];
          const localStorage={
            getItem(k){reads.push(k);return values.get(k)??null;},
            setItem(k,v){writes.push(k);values.set(k,v);}
          };
          const adapter=vm.runInNewContext(prefix+'return storage;})();',{document:{querySelectorAll:()=>[]},localStorage});
          assert.equal(adapter.load(),null);
          const c=create(adapter);
          assert.deepEqual(c.snapshot(),clean);
          assert.ok(reads.length>0 && reads.every(k=>k===freshKey));
          assert.equal(writes.length,0);
          for(const raw of [legacy,JSON.stringify({version:1,state:clean}),JSON.stringify({format:'ancien-format',version:1,state:clean})]){
            assert.throws(()=>c.restore(raw));
            assert.deepEqual(c.snapshot(),clean);
          }
          assert.equal(writes.length,0);
          c.saveDirectory('hotels',{id:'h',name:'Hôtel test'});
          c.saveDirectory('contacts',{id:'c',hotelId:'h',name:'Contact test',phone:'+32470000001'});
          c.saveDirectory('drivers',{id:'d',name:'Chauffeur test',phone:'+32470000002',nativeId:'samsung-demo'});
          const directoryBefore=c.snapshot();
          assert.throws(()=>c.saveDirectory('hotels',{id:'dup-h',name:' HOTEL TEST '}));
          assert.throws(()=>c.saveDirectory('contacts',{id:'dup-c',hotelId:'h',name:'Contact différent',phone:'0470 00 00 01'}));
          assert.throws(()=>c.saveDirectory('drivers',{id:'dup-d1',name:'Chauffeur renommé',phone:'+32470000003',nativeId:'samsung-demo'}));
          assert.throws(()=>c.saveDirectory('drivers',{id:'dup-d2',name:'Chaufféur test',phone:'+32470000003'}));
          assert.deepEqual(c.snapshot(),directoryBefore);
          c.saveDirectory('drivers',{id:'d',name:'Chauffeur nouveau',phone:'+32470000003',nativeId:'samsung-demo'});
          assert.equal(c.snapshot().drivers.length,1);
          assert.equal(c.snapshot().drivers[0].phone,'+32470000003');
          c.plan({id:'new-ride',hotelId:'h',hotelName:'Hôtel test',contactId:'c',contactName:'Contact test',driverId:'d',driverName:'Chauffeur test',from:'Départ test',to:'Destination test'});
          c.load('new-ride');c.start('new-ride');c.finish('new-ride');c.cash('new-ride',1000);
          const before=c.snapshot();
          assert.equal(before.courses[0].status,'archived');
          c.removeDirectory('hotels','h');c.removeDirectory('drivers','d');
          const after=c.snapshot();
          assert.equal(after.hotels.length+after.contacts.length+after.drivers.length,0);
          assert.deepEqual(after.courses,before.courses);
          assert.deepEqual(after.ledger,before.ledger);
          assert.deepEqual(create(adapter).snapshot(),after);
          assert.deepEqual(core.readBackup(c.backup()),after);
          // Rebuilding a directory with similar names and new numbers must never mutate past courses.
          c.saveDirectory('hotels',{id:'h-new',name:'HOTEL TEST'});
          c.saveDirectory('contacts',{id:'c-new',hotelId:'h-new',name:'Contact test',phone:'+32470000004'});
          c.saveDirectory('drivers',{id:'d-new',name:'Chauffeur nouveau',phone:'+32470000005'});
          assert.deepEqual(c.snapshot().courses,before.courses);
          assert.deepEqual(c.snapshot().ledger,before.ledger);
          assert.deepEqual(create(adapter).snapshot(),c.snapshot());
          assert.ok(writes.length>0 && writes.every(k=>k===freshKey));
          for(const k of oldKeys)assert.equal(values.get(k),legacy);
          // Interface de refonte uniquement : aucune palette historique, aucun style externe.
          const html=fs.readFileSync('refonte/interface.html','utf8');
          assert.doesNotMatch(html,/<link\b[^>]*rel=["']stylesheet|<link\b[^>]*href=/i);
          assert.doesNotMatch(source,/\.style\.(?:color|backgroundColor|borderColor)\s*=|style\.setProperty\s*\(/);
          for(const [,css] of html.matchAll(/<style>([\s\S]*?)<\/style>/gi)){
            assert.doesNotMatch(css,/@import\b|url\s*\(/i);
            for(const [hex] of css.matchAll(/#[0-9a-f]{6}\b/gi)){
              const h=hex.toLowerCase();assert.ok(h.slice(1,3)===h.slice(3,5)&&h.slice(3,5)===h.slice(5,7),'Couleur non neutre à réauditer : '+hex);
            }
            assert.doesNotMatch(css,/\b(?:rgb|hsl)a?\s*\(/i);
          }
          assert.match(html,/<button[^>]*id="pay-cash"/);
          assert.match(html,/<button[^>]*id="pay-sumup"/);
          const manifest=fs.readFileSync('app/src/main/AndroidManifest.xml','utf8');
          const gradle=fs.readFileSync('app/build.gradle','utf8');
          assert.match(gradle,/applicationId\s+'be\.montaxi\.pro'/);
          assert.doesNotMatch(gradle,/applicationId\s+'be\.montaxi\.gestion\.empreinte'/);
          assert.match(manifest,/android:label="Mon Taxi Pro"/);
          assert.match(manifest,/android:allowBackup="false"/);
          assert.ok(manifest.includes('android:dataExtractionRules="@xml/refonte_data_extraction_rules"'));
          const rules=fs.readFileSync('app/src/main/res/xml/refonte_data_extraction_rules.xml','utf8');
          assert.ok(rules.includes('<device-transfer>')&&rules.includes('<cloud-backup>'));
          assert.equal((rules.match(/<exclude domain=/g)||[]).length,18);
          console.log('Base vierge, ancien stockage ignoré et intact, anciens formats rejetés, archives nouvelles indépendantes du répertoire.');
          JS
  point10-reliability:
    needs: clean-data-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Point 10 - redémarrages, écritures interrompues, doublons et parcours répétés
        run: node tests/refonte-reliability.cjs
  point8-precheck:
    needs: point10-reliability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Calculs en centimes, bilan, sauvegarde locale et restauration contrôlée
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),core=require('./refonte/clean-core.js'),create=require('./refonte/course-controller.js');
          let s=core.empty();
          for(const id of ['cash','card','not-worked']){
            s=core.addCourse(s,{id,driverIsMe:id==='cash',commissionCents:500});
            if(id!=='not-worked')for(const type of ['load','start','finish'])s=core.apply(s,id,{type});
          }
          s=core.recordCash(s,'cash',5000);
          s=core.apply(s,'card',{type:'beginPayment',method:'sumup',amountCents:6000,attemptId:'a'});
          s=core.apply(s,'card',{type:'paymentConfirmed',attemptId:'a',result:'confirmed',reference:'T'});
          for(const p of s.ledger){p.paidAt='2026-12-01T12:00:00Z';s.courses.find(c=>c.id===p.courseId).payment.paidAt=p.paidAt;}
          s=core.setDay(s,'2026-12-01',{cash:0,appli:2000,commission:500,fuel:1500,expense:500,invoiceHt:1000});
          s=core.setFixed(s,'2026-12',31000);
          const d=core.dayTotals(s,'2026-12-01');
          assert.equal(d.cardGross,6000);assert.equal(d.fee,120);assert.equal(d.cardNet,5880);
          assert.equal(d.cashReal,4000);assert.equal(d.invoiceTtc,1060);
          assert.equal(d.revenue,12940);assert.equal(d.result,9940);
          const m=core.monthTotals(s,'2026-12');
          assert.equal(m.workedDays,1);assert.equal(m.average,12940);assert.equal(m.fixed,31000);assert.equal(m.result,-20060);
          assert.equal(core.paymentDay('2026-11-30T23:05:00Z'),'2026-12-01');
          const raw=core.backup(s);assert.deepEqual(core.readBackup(raw),s);
          assert.throws(()=>core.readBackup(JSON.stringify({version:1,state:s})));
          const broken=JSON.parse(raw);broken.state.ledger.push(broken.state.ledger[0]);assert.throws(()=>core.readBackup(JSON.stringify(broken)));
          const c=create();c.restore(raw);assert.equal(c.monthly('2026-12').revenue,12940);
          assert.throws(()=>c.restore('invalid'));assert.equal(c.snapshot().ledger.length,2);
          let pending=core.addCourse(core.empty(),{id:'pending'});for(const type of ['load','start','finish'])pending=core.apply(pending,'pending',{type});
          pending=core.apply(pending,'pending',{type:'beginPayment',method:'sumup',amountCents:100,attemptId:'p'});
          assert.throws(()=>core.backup(pending));
          assert.throws(()=>core.readBackup(JSON.stringify({format:'mon-taxi-android-autonome',version:1,state:pending})));
          const source=require('node:fs').readFileSync('app/src/main/java/be/montaxi/gestion/MainActivity.java','utf8');
          assert.match(source,/MediaStore.Downloads.IS_PENDING/);assert.match(source,/Intent.ACTION_OPEN_DOCUMENT/);
          assert.doesNotMatch(source,/DownloadManager.Request|web.setDownloadListener/);
          // Additional regression cases: non-worked day, negative cash, rounding, and failed writes.
          const empty=core.empty();
          assert.equal(core.monthTotals(empty,'2026-12').workedDays,0);
          assert.equal(core.monthTotals(empty,'2026-12').average,0);
          let edge=core.setFixed(empty,'2028-02',10001);
          assert.equal(core.monthTotals(edge,'2028-02').fixed,10001);
          edge=core.setDay(edge,'2028-02-29',{cash:100,appli:0,commission:200,fuel:0,expense:0,invoiceHt:0});
          assert.equal(core.dayTotals(edge,'2028-02-29').cashReal,-100);
          assert.equal(core.dayTotals(edge,'2028-02-29').worked,false);
          assert.throws(()=>core.setDay(edge,'2028-02-30',{cash:0,appli:0,commission:0,fuel:0,expense:0,invoiceHt:0}));
          let persisted=core.empty(),fail=false;
          const guarded=create({load:()=>persisted,save:s=>{if(fail)throw Error('écriture interrompue');persisted=JSON.parse(JSON.stringify(s));}});
          guarded.restore(raw);fail=true;
          assert.throws(()=>guarded.restore(core.backup(empty)));
          assert.equal(guarded.snapshot().ledger.length,2);assert.equal(persisted.ledger.length,2);
          assert.throws(()=>guarded.setFixed('2026-12',99999));assert.equal(guarded.monthly('2026-12').fixed,31000);
          assert.match(source,/import android\.content\.Intent;/);
          console.log('Point 8 : calculs, moyenne, mois, frais, commission, sauvegarde et restauration contrôlée OK.');
