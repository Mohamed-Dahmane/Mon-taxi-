          s=core.apply(s,'card',{type:'paymentConfirmed',attemptId:'a',result:'confirmed',reference:'T'});
          for(const p of s.ledger){p.paidAt='2026-12-01T12:00:00Z';s.courses.find(c=>c.id===p.courseId).payment.paidAt=p.paidAt;}
          s=core.setDay(s,'2026-12-01',{cash:0,appli:2000,commission:500,fuel:1500,expense:500,invoiceHt:1000});
          s=core.setFixed(s,'2026-12',31000);
          const d=core.dayTotals(s,'2026-12-01');
          assert.equal(d.cardGross,6000);assert.equal(d.fee,120);assert.equal(d.cardNet,5880);
          assert.equal(d.cashReal,4000);assert.equal(d.invoiceTtc,1060);
          assert.equal(d.revenue,12940);assert.equal(d.result,9940);
          const m=core.monthTotals(s,'2026-12');
          assert.equal(m.workedDays,1);assert.equal(m.average,12940);assert.equal(m.fixed,31000);assert.equal(m.result,-20060);
          assert.equal(core.paymentDay('2026-11-30T23:05:00Z'),'2026-12-01');
          const raw=core.backup(s);assert.deepEqual(core.readBackup(raw),s);
          assert.throws(()=>core.readBackup(JSON.stringify({version:1,state:s})));
          const broken=JSON.parse(raw);broken.state.ledger.push(broken.state.ledger[0]);assert.throws(()=>core.readBackup(JSON.stringify(broken)));
          const c=create();c.restore(raw);assert.equal(c.monthly('2026-12').revenue,12940);
          assert.throws(()=>c.restore('invalid'));assert.equal(c.snapshot().ledger.length,2);
          let pending=core.addCourse(core.empty(),{id:'pending'});for(const type of ['load','start','finish'])pending=core.apply(pending,'pending',{type});
          pending=core.apply(pending,'pending',{type:'beginPayment',method:'sumup',amountCents:100,attemptId:'p'});
          assert.throws(()=>core.backup(pending));
          assert.throws(()=>core.readBackup(JSON.stringify({format:'mon-taxi-android-autonome',version:1,state:pending})));
          const source=require('node:fs').readFileSync('app/src/main/java/be/montaxi/gestion/MainActivity.java','utf8');
          assert.match(source,/MediaStore.Downloads.IS_PENDING/);assert.match(source,/Intent.ACTION_OPEN_DOCUMENT/);
          assert.doesNotMatch(source,/DownloadManager.Request|web.setDownloadListener/);
          // Additional regression cases: non-worked day, negative cash, rounding, and failed writes.
          const empty=core.empty();
          assert.equal(core.monthTotals(empty,'2026-12').workedDays,0);
          assert.equal(core.monthTotals(empty,'2026-12').average,0);
          let edge=core.setFixed(empty,'2028-02',10001);
          assert.equal(core.monthTotals(edge,'2028-02').fixed,10001);
          edge=core.setDay(edge,'2028-02-29',{cash:100,appli:0,commission:200,fuel:0,expense:0,invoiceHt:0});
          assert.equal(core.dayTotals(edge,'2028-02-29').cashReal,-100);
          assert.equal(core.dayTotals(edge,'2028-02-29').worked,false);
          assert.throws(()=>core.setDay(edge,'2028-02-30',{cash:0,appli:0,commission:0,fuel:0,expense:0,invoiceHt:0}));
          let persisted=core.empty(),fail=false;
          const guarded=create({load:()=>persisted,save:s=>{if(fail)throw Error('écriture interrompue');persisted=JSON.parse(JSON.stringify(s));}});
          guarded.restore(raw);fail=true;
          assert.throws(()=>guarded.restore(core.backup(empty)));
          assert.equal(guarded.snapshot().ledger.length,2);assert.equal(persisted.ledger.length,2);
          assert.throws(()=>guarded.setFixed('2026-12',99999));assert.equal(guarded.monthly('2026-12').fixed,31000);
          assert.match(source,/import android\.content\.Intent;/);
          console.log('Point 8 : calculs, moyenne, mois, frais, commission, sauvegarde et restauration contrôlée OK.');
