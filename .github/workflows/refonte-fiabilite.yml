          for(const n of [0,-1,0.5,Infinity,NaN])assert.throws(()=>c.cash('cash',n));
          fail=true;assert.throws(()=>c.cash('cash',5025));assert.equal(c.snapshot().ledger.length,0);
          assert.equal(c.snapshot().courses[0].status,'awaiting_payment');
          fail=false;c.cash('cash',5025);assert.throws(()=>c.cash('cash',5025));
          const recovered=create(storage).snapshot();
          assert.equal(recovered.courses[0].status,'archived');assert.equal(recovered.ledger.length,1);
          assert.equal(recovered.ledger[0].amountCents,5025);assert.equal(recovered.ledger[0].method,'cash');
