  point11-signed-apk:
    if: ${{ (github.event_name == 'push' && github.ref_name == 'test/forfait-aeroport-6480-20261126') || (github.event_name == 'workflow_dispatch' && inputs.compile_apk == true) }}
    needs: [points-1-to-10, receipt-contract, pdf-interface, integration, forfait, sumup-branches]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Préparer exclusivement les ressources Android de refonte
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/app app/src/main/res/drawable-nodpi
          cp refonte/interface.html app/src/main/assets/index.html
          cp refonte/clean-core.js refonte/course-controller.js refonte/sumup-course-payment.js refonte/course-ui.js app/src/main/assets/
          cp app/mercedes-foreground.webp app/mercedes-studio.webp app/src/main/assets/app/
          base64 -d app/icon/mon_taxi.jpg.base64 > app/src/main/res/drawable-nodpi/mon_taxi_icon.jpg
          cmp refonte/interface.html app/src/main/assets/index.html
          ! grep -rE 'taxi_management_backups|taxi_hotel_sync|github[.]io|taxi_sumup_transactions' app/src/main/assets --include='*.html' --include='*.js'
      - name: Préparer la clé persistante de production sans exposer les secrets
        env:
          TAXI_KEYSTORE_B64: ${{ secrets.TAXI_KEYSTORE_B64 }}
          TAXI_SIGNING_STORE_PASSWORD: ${{ secrets.TAXI_SIGNING_STORE_PASSWORD }}
          TAXI_SIGNING_KEY_ALIAS: ${{ secrets.TAXI_SIGNING_KEY_ALIAS }}
          TAXI_SIGNING_KEY_PASSWORD: ${{ secrets.TAXI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          names=('TAXI_KEYSTORE_B64','TAXI_SIGNING_STORE_PASSWORD','TAXI_SIGNING_KEY_ALIAS','TAXI_SIGNING_KEY_PASSWORD')
          if any(not os.environ.get(n,'').strip() for n in names):
              raise SystemExit('Signature de production non configurée. Aucun APK de remplacement ne sera livré.')
          value=os.environ[names[0]].strip()
          value=re.sub(r'^(?:export\s+)?TAXI_KEYSTORE_B64\s*=\s*','',value)
          value=value.strip("'\"").replace("\\r","").replace("\\n","")
          value=re.sub(r'\s+','',value)
          data=base64.b64decode(value+'='*(-len(value)%4),altchars=b'-_',validate=True)
          if not data.startswith((b'\xfe\xed\xfe\xed',b'\xce\xce\xce\xce',b'\x30')):
              raise SystemExit('Format du magasin de signature non reconnu.')
          Path(os.environ['RUNNER_TEMP'],'taxi-refonte-release.jks').write_bytes(data)
          PY
      - name: Compiler et signer exclusivement la nouvelle application
        env:
          TAXI_SIGNING_STORE_FILE: ${{ runner.temp }}/taxi-refonte-release.jks
          TAXI_SIGNING_STORE_PASSWORD: ${{ secrets.TAXI_SIGNING_STORE_PASSWORD }}
          TAXI_SIGNING_KEY_ALIAS: ${{ secrets.TAXI_SIGNING_KEY_ALIAS }}
          TAXI_SIGNING_KEY_PASSWORD: ${{ secrets.TAXI_SIGNING_KEY_PASSWORD }}
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --max-workers=2 assembleRelease 2>&1 | tee android-release-build.log
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Vérifier le contenu réellement embarqué dans l'APK
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('app/build/outputs/apk/release/app-release.apk')
          expected={'index.html','clean-core.js','course-controller.js','sumup-course-payment.js','course-ui.js'}
          with zipfile.ZipFile(apk) as z:
              app_sources={n.removeprefix('assets/') for n in z.namelist() if n.startswith('assets/') and n.endswith(('.html','.js','.css'))}
              assert app_sources==expected, f'Sources embarquées inattendues: {app_sources}'
              for n in sorted(expected):
                  original='interface.html' if n=='index.html' else n
                  data=z.read('assets/'+n)
                  assert data==Path('refonte',original).read_bytes(), n
                  for forbidden in (b'taxi_management_backups',b'taxi_hotel_sync',b'taxi_sumup_transactions',b'github.io'):
                      assert forbidden not in data,(n,forbidden)
              print('APK : seules les sources Android de refonte sont embarquées, aucun ancien flux partagé.')
          PY
      - name: Vérifier signature, identifiant, version, ressources et absence de données héritées
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose --print-certs "$apk" | tee signature-verification.txt
          "$sdk/aapt" dump badging "$apk" > apk-identity.txt
          grep -q "package: name='be.montaxi.pro' versionCode='2122'" apk-identity.txt
          grep -q "^application-label:'Mon Taxi Pro'" apk-identity.txt
          if grep -q "application-debuggable" apk-identity.txt; then exit 1; fi
          "$sdk/aapt" dump xmltree "$apk" AndroidManifest.xml > manifest-verification.txt
          grep -E 'android:allowBackup.*0x0$' manifest-verification.txt
          grep -q 'android:dataExtractionRules' manifest-verification.txt
          mkdir -p "$RUNNER_TEMP/point11"
          cp "$apk" "$RUNNER_TEMP/point11/Mon-Taxi-Pro.apk"
          cd "$RUNNER_TEMP/point11"
          sha256sum Mon-Taxi-Pro.apk > SHA256SUMS.txt
      - name: Supprimer le magasin temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/taxi-refonte-release.jks"
      - name: Publier le dossier de contrôle de signature
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Point-11-controles-APK
          path: |
            android-release-build.log
            signature-verification.txt
            apk-identity.txt
            manifest-verification.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Conserver le candidat APK signé et son empreinte
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Taxi-Pro-2122-signe
          path: |
            ${{ runner.temp }}/point11/Mon-Taxi-Pro.apk
            ${{ runner.temp }}/point11/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  receipt-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/sumup-oauth-receipt-contract.mjs
      - run: node tests/sumup-oauth-transport.mjs
      - run: node tests/sumup-oauth-protection.mjs
      - run: node tests/sumup-oauth-integration.mjs
  pdf-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: command -v google-chrome || npx playwright install --with-deps chromium
      - run: node tests/refonte-cash-receipt.cjs
      - run: node tests/refonte-receipt-browser.cjs
      - run: node tests/refonte-receipt-credential.cjs

  forfait:
    needs: clean-data-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le forfait et les corrections sur données fictives
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const c=require('./refonte/course-controller')();
          assert.equal(c.plan({id:'test',to:'BRU'}).paymentDraftCents,6480);
          c.savePaymentDraft('test',5500);
          c.editDetails('test',{room:'207',to:'CRL'});
          assert.equal(c.load('test').paymentDraftCents,5500);
          c.start('test');
          c.savePaymentDraft('test',7000);
          assert.equal(c.finish('test').paymentDraftCents,7000);
          c.savePaymentDraft('test',null);
          assert.equal(c.snapshot().ledger.length,0);
          c.removeCourse('test');
          assert.equal(c.snapshot().courses.length,0);
          JS

  sumup-branches:
    name: SumUp et remboursements (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: test/forfait-aeroport-6480-20261126
            ref: ${{ github.sha }}
          - branch: test/sumup-oauth-receipts-2122-20261125
            ref: ecda7a0cd99c684b6cd5d896b8d20117b2dc34e2
          - branch: test/planning-multi-vehicules-20261125
            ref: ecda7a0cd99c684b6cd5d896b8d20117b2dc34e2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/refonte-refund.cjs
      - run: node tests/refund-bank-2112.mjs
      - run: node tests/sumup-oauth-receipt-contract.mjs
      - run: node tests/sumup-oauth-transport.mjs
      - run: node tests/sumup-oauth-protection.mjs
      - run: node tests/sumup-oauth-integration.mjs
      - run: npm install --no-save playwright
      - run: command -v google-chrome || npx playwright install --with-deps chromium
      - name: Utiliser le scénario navigateur commun aux trois versions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: scenarios
          sparse-checkout: tests/refonte-refund-browser.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp scenarios/tests/refonte-refund-browser.cjs tests/refonte-refund-browser.cjs
      - run: node tests/refonte-refund-browser.cjs
      - run: node tests/refonte-receipt-browser.cjs
