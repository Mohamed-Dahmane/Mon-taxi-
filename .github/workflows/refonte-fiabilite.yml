  sumup:
    needs: point8-precheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le journal natif et les garde-fous du terminal
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=fs.readFileSync('app/src/main/java/be/montaxi/gestion/MainActivity.java','utf8');
          const u=fs.readFileSync('refonte/course-ui.js','utf8');
          assert.match(m,/foreignTransactionId\(p.getString\("attemptId"\)\)/);
          assert.match(m,/configureRetryPolicy\(2000,60000,true\)/);
          assert.match(m,/setSumUpStage\("checkout"\);[\s\S]*?SumUpAPI.checkout/);
          assert.match(m,/SumUpAPI.Param.FOREIGN_TRANSACTION_ID/);
          assert.match(m,/SumUpAPI.Response.TX_INFO/);
          const warm=m.slice(m.indexOf("private void prepareIdleSumUpReader()"),m.indexOf("private void openSumUpReader()"));
          assert.match(warm,/if\(!unlocked\|\|!resumed\)return;/);
          assert.match(warm,/pendingSumUp\(\)==null&&SumUpAPI.isLoggedIn\(\)&&!SumUpAPI.isCardReaderConnected\(\)/);
          assert.match(warm,/SumUpAPI.prepareForCheckout\(\)/);
          assert.doesNotMatch(warm,/SumUpAPI\.checkout|openSumUpCheckout|openCardReaderPage|setSumUpStage/);
          const reconnect=m.slice(m.indexOf('private void openSumUpReader()'),m.indexOf('private void openSumUpCheckout()'));
          assert.ok(reconnect.includes('SumUpAPI.prepareForCheckout()'));
          assert.ok(reconnect.includes('setSumUpStage("reconnecting")'));
          assert.ok(reconnect.includes('elapsedRealtime()+8000L'));
          assert.ok(reconnect.includes('!attempt.equals(p.optString("attemptId"))'));
          assert.ok(reconnect.includes('if(resumed&&SumUpAPI.isCardReaderConnected()){openSumUpCheckout();return;}'));
          assert.ok(reconnect.includes('if(android.os.SystemClock.elapsedRealtime()>=deadline)'));
          assert.doesNotMatch(reconnect,/SumUpAPI\.checkout\(/);
          assert.match(m,/transactionField\(info,"getAmount"\)/);
          assert.match(m,/cents!=p.getInt\("requestedCents"\)/);
          assert.match(m,/persistSumUp\(p\);activeSumUpAttempt=null;publishSumUp\(\)/);
          const recovery=m.slice(m.indexOf('private void recoverInterruptedSumUp('),m.indexOf('// Read-only reconciliation;'));
          assert.ok(recovery.includes('!attempt.equals(p.optString("attemptId"))||!courseId.equals(p.optString("courseId"))'));
          assert.ok(recovery.includes('if(activeSumUpAttempt==null&&("setup".equals(stage)||"login".equals(stage)||"reconnecting".equals(stage)||"reader".equals(stage)))'));
          assert.match(recovery,/finishSumUp\("cancelled",null,null,null\)/);
          assert.doesNotMatch(recovery,/SumUpAPI\.checkout|openSumUpCheckout|remove\("pending"\)/);
          assert.ok(recovery.includes('"checkout".equals(stage)?'));
          assert.match(u,/recoverInterrupted\(c.id,c.payment.attemptId\)/);
          assert.match(u,/controller.beginSumUp\(c.id,draft.cents,attempt\)/);
          assert.match(u,/window.TaxiSumUp.checkout\(c.id,attempt,draft.cents\)/);
          const lookup=m.slice(m.indexOf('// Read-only reconciliation;'),m.indexOf('private void ackSumUp('));
          assert.match(lookup,/foreign_transaction_id=/);assert.match(lookup,/setRequestMethod\("GET"\)/);assert.match(lookup,/!attempt.equals\(tx.optString\("foreign_transaction_id"\)\)/);assert.doesNotMatch(lookup,/SumUpAPI\.checkout|remove\("pending"\)/);
          console.log('Point 6 : contrat SDK, référence unique, montant confirmé, journal persistant et blocage en cas de doute.');
