name: Construire APK Gestion Taxi
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK on runner
        run: |
          test -d "$ANDROID_HOME" || { echo 'Android SDK missing'; exit 1; }
          echo "Android SDK: $ANDROID_HOME"
      - name: Prepare embedded interface
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gestion-Taxi-V11-APK-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
