name: Construire APK Gestion Taxi
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAXI_KEYSTORE_B64 != '' && secrets.TAXI_SIGNING_STORE_PASSWORD != '' && secrets.TAXI_SIGNING_KEY_ALIAS != '' && secrets.TAXI_SIGNING_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK reliably
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify build environment
        run: |
          java -version
          gradle --version
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/be/montaxi/gestion/MainActivity.java
          test -f index.html
      - name: Prepare embedded interface
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: Build debug APK with diagnostic logs
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee android-build.log
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Taxi-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Gestion-Taxi-V12-APK-debug-non-mise-a-jour
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Préparer la clé de signature persistante (si configurée)
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "$TAXI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/taxi-release.jks"
          echo "TAXI_SIGNING_STORE_FILE=$RUNNER_TEMP/taxi-release.jks" >> "$GITHUB_ENV"
        env:
          TAXI_KEYSTORE_B64: ${{ secrets.TAXI_KEYSTORE_B64 }}
      - name: Construire APK V12 signé pour mise à jour
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: gradle --no-daemon assembleRelease
        env:
          TAXI_SIGNING_STORE_PASSWORD: ${{ secrets.TAXI_SIGNING_STORE_PASSWORD }}
          TAXI_SIGNING_KEY_ALIAS: ${{ secrets.TAXI_SIGNING_KEY_ALIAS }}
          TAXI_SIGNING_KEY_PASSWORD: ${{ secrets.TAXI_SIGNING_KEY_PASSWORD }}
      - name: Vérifier cryptographiquement l'APK V12 signé
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
      - name: Publier APK signé V12
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Taxi-V12-APK-signe
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
