name: Test Android - reçu espèces original
on:
  push:
    branches: [isolation/sumup-oauth-only-20261127]
    paths: ['.github/workflows/cash-receipt-native-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          "$ANDROID_HOME/platform-tools/adb" version
      - name: Prepare isolated Android test project
        run: |
          mkdir -p receipt-test/src/main/java/be/montaxi/gestion
          cp app/src/main/java/be/montaxi/gestion/TaxiCashReceiptPdf.java receipt-test/src/main/java/be/montaxi/gestion/
          cat > receipt-test/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'ReceiptNativeTest'
          EOF
          cat > receipt-test/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' }
          android {
            namespace 'be.montaxi.gestion'
            compileSdk 35
            defaultConfig { applicationId 'be.montaxi.receipttest'; minSdk 26; targetSdk 35 }
          }
          EOF
          cat > receipt-test/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Receipt test"><activity android:name=".ReceiptTest" android:exported="true"/></application></manifest>
          EOF
          cat > receipt-test/src/main/java/be/montaxi/gestion/ReceiptTest.java <<'EOF'
          package be.montaxi.gestion;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.ParcelFileDescriptor;
          import android.graphics.Bitmap;
          import android.graphics.pdf.PdfRenderer;
          import org.json.JSONObject;
          import java.io.*;
          public class ReceiptTest extends Activity {
            public void onCreate(Bundle state) {
              super.onCreate(state);
              try {
                JSONObject r=new JSONObject("{\"amountCents\":2500,\"reference\":\"cash:test-hd-integration\",\"route\":\"Trajet de démonstration\",\"vehicle\":\"Voiture\",\"driverNumber\":\"TXM-3451\",\"paidAt\":\"2026-11-28T08:00:00Z\",\"strokes\":[[[100,300],[250,150],[400,350],[600,200]]]}");
                File pdf=new File(getFilesDir(),"receipt.pdf");
                try(FileOutputStream out=new FileOutputStream(pdf)){out.write(TaxiCashReceiptPdf.render(r));}
                try(ParcelFileDescriptor fd=ParcelFileDescriptor.open(pdf,ParcelFileDescriptor.MODE_READ_ONLY); PdfRenderer renderer=new PdfRenderer(fd); PdfRenderer.Page page=renderer.openPage(0)){
                  float scale=Math.min(4f,Math.min(2000f/page.getWidth(),5000f/page.getHeight()));
                  Bitmap bitmap=Bitmap.createBitmap(Math.round(page.getWidth()*scale),Math.round(page.getHeight()*scale),Bitmap.Config.ARGB_8888);
                  bitmap.eraseColor(android.graphics.Color.WHITE);
                  page.render(bitmap,null,null,PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                  try(FileOutputStream out=new FileOutputStream(new File(getFilesDir(),"receipt.png"))){if(!bitmap.compress(Bitmap.CompressFormat.PNG,100,out))throw new IOException("PNG");}
                  bitmap.recycle();
                }
              } catch(Exception e){throw new RuntimeException(e);}
            }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and locate test APK
        run: |
          gradle -p receipt-test assembleDebug
          find receipt-test/build/outputs/apk -type f -name '*.apk' -print
          mapfile -t apks < <(find receipt-test/build/outputs/apk/debug -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$GITHUB_WORKSPACE/native-receipt-test.apk"
          test -s "$GITHUB_WORKSPACE/native-receipt-test.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install "$GITHUB_WORKSPACE/native-receipt-test.apk"
            adb shell am start -n be.montaxi.receipttest/be.montaxi.gestion.ReceiptTest
            mkdir -p output
            for i in $(seq 1 30); do adb shell run-as be.montaxi.receipttest test -s files/receipt.png && break; sleep 1; done
            adb exec-out run-as be.montaxi.receipttest cat files/receipt.pdf > output/receipt.pdf
            adb exec-out run-as be.montaxi.receipttest cat files/receipt.png > output/receipt.png
            python3 -c "from pathlib import Path; assert Path('output/receipt.pdf').read_bytes().startswith(b'%PDF'); assert Path('output/receipt.png').read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a')); import struct; assert struct.unpack('>II',Path('output/receipt.png').read_bytes()[16:24]) == (1440,3120)"
      - name: Test authenticated automatic publication
        env:
          RECEIPT_PUBLISH_TOKEN: ${{ secrets.TAXI_RECEIPT_PUBLISH_TOKEN }}
        run: |
          set -eu
          if ! [[ "$RECEIPT_PUBLISH_TOKEN" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Dedicated publication secret missing or invalid"
            exit 1
          fi
          id=$(openssl rand -hex 32)
          base=https://uenyvsiturkihectolxp.supabase.co/functions/v1
          status=$(curl --silent --show-error --max-time 40 --output /tmp/publish-response --write-out '%{http_code}' -H "Authorization: Bearer $RECEIPT_PUBLISH_TOKEN" -H 'Content-Type: image/png' --data-binary @output/receipt.png "$base/taxi-receipt-publish-v1?id=$id")
          [[ "$status" == 200 || "$status" == 201 ]]
          curl --fail --silent --show-error --max-time 40 "$base/taxi-receipt-view-v1?id=$id" -o /tmp/remote-receipt.png
          cmp output/receipt.png /tmp/remote-receipt.png
          echo "Cash receipt publication and exact byte comparison passed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cash-receipt-hd
          path: output/
          if-no-files-found: error
