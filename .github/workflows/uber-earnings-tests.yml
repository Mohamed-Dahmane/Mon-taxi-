name: Uber earnings adapter tests
on:
  push:
    paths:
      - 'integrations/uber-earnings.js'
      - 'integrations/uber-earnings.test.mjs'
      - '.github/workflows/uber-earnings-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Uber adapter tests
        run: node --experimental-default-type=module --test integrations/uber-earnings.test.mjs
