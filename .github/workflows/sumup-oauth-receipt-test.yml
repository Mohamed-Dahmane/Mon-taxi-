name: OAuth SumUp 2122 - tests isolés
on:
  push:
    branches: [test/sumup-oauth-receipts-2122-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/sumup-oauth-receipt-contract.mjs
      - run: node tests/sumup-oauth-transport.mjs
      - run: node tests/sumup-oauth-protection.mjs
  pdf-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: command -v google-chrome || npx playwright install --with-deps chromium
      - run: node tests/refonte-cash-receipt.cjs
      - run: node tests/refonte-receipt-browser.cjs
      - run: node tests/refonte-receipt-credential.cjs
