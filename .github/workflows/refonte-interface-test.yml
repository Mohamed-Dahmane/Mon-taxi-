name: Vérifier la nouvelle interface Fold
on:
  push:
    branches: [refonte/base-saine-20261124]
    paths: ['refonte/**', '.github/workflows/refonte-interface-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: command -v google-chrome || npx playwright install --with-deps chromium
      - name: Tester la géométrie et les deux chemins de paiement
        run: |
          mkdir -p interface-report
          cat > .interface-test.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),assert=require('node:assert/strict');
          const root=require('node:path').resolve('refonte');
          (async()=>{
            const browser=await chromium.launch({executablePath:fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':undefined,headless:true,args:['--no-sandbox']});
            const report=[];
            try{
              for(const [width,height] of [[320,640],[360,780],[400,850],[600,720],[720,800],[840,720],[320,300],[720,350]]){
                const context=await browser.newContext({viewport:{width,height},isMobile:true,hasTouch:true,deviceScaleFactor:1,serviceWorkers:'block'});
                try{
                  await context.route('**/*',r=>{
                    const url=new URL(r.request().url());
                    const file=url.pathname.slice(1)||'interface.html';
                    if(url.origin!=='http://taxi-refonte.test'||r.request().method()!=='GET'||!['interface.html','clean-core.js','course-controller.js','sumup-course-payment.js','course-ui.js'].includes(file))return r.abort();
                    return r.fulfill({contentType:file.endsWith('.js')?'application/javascript':'text/html',body:fs.readFileSync(root+'/'+file)});
                  });
                  await context.addInitScript(()=>{
                    window.wazeCalls=[];window.wazeAcks=[];window.overlayRequests=0;window.terminalCalls=0;
                    window.sumupAttempts=[];window.sumupAcks=[];window.savedBackup=null;
                    window.TaxiBackup={exportJson:raw=>{window.savedBackup=raw;window.dispatchEvent(new CustomEvent('taxi-backup-result',{detail:{action:'exported'}}));},pickJson:()=>window.dispatchEvent(new CustomEvent('taxi-backup-result',{detail:{action:'imported',content:window.savedBackup}})),approveRestore:()=>window.dispatchEvent(new CustomEvent('taxi-backup-result',{detail:{action:'restore-approved'}}))};
                    window.TaxiSumUp={checkout:(courseId,attemptId,amountCents)=>{window.terminalCalls++;window.sumupAttempts.push({courseId,attemptId,amountCents,currency:'EUR'});},recover:()=>{},ack:id=>window.sumupAcks.push(id)};
                    window.TaxiContacts={
                      pick:requestId=>{window.contactPicks=(window.contactPicks||0)+1;window.dispatchEvent(new CustomEvent('taxi-contacts-result',{detail:{requestId,contacts:[{nativeId:'demo-'+window.contactPicks,name:'Personne fictive '+window.contactPicks,phone:'+3247000000'+window.contactPicks}]}}));},
                      navigateWaze:(id,destination)=>{window.wazeCalls.push({id,destination});window.dispatchEvent(new CustomEvent('taxi-waze-result',{detail:{courseId:id,status:'opened',overlay:true}}));},
                      requestWazeReturn:()=>{},ackWazeReturn:id=>window.wazeAcks.push(id),enableWazeOverlay:()=>window.overlayRequests++
                    };
                  });
                  const page=await context.newPage(),errors=[];
                  page.on('pageerror',e=>errors.push(e.message));
                  await page.goto('http://taxi-refonte.test/');
                  const inspect=async screen=>{
                    const visible=page.locator('.screen:not([hidden])');
                    assert.equal(await visible.getAttribute('id'),screen);
                    const result=await page.evaluate(()=>{
                      const controls=[...document.querySelectorAll('button,input,select')].filter(e=>e.getClientRects().length);
                      const rs=controls.map(e=>({e,r:e.getBoundingClientRect()})),problems=[];
                      const routes=controls.map(e=>e.dataset.page||e.dataset.go).filter(Boolean);
                      if(new Set(routes).size!==routes.length)problems.push('Accès redondants sur la même page');
                      const name=e=>e.id||e.textContent.trim()||e.placeholder||e.type;
                      for(const {e,r} of rs){
                        if(r.width<48||r.height<48)problems.push('Taille '+name(e));
                        if(r.left<-.5||r.right>innerWidth+.5)problems.push('Hors écran '+name(e));
                        if(e.tagName==='BUTTON'&&(e.scrollWidth>e.clientWidth+1||e.scrollHeight>e.clientHeight+1))problems.push('Texte tronqué '+name(e));
                      }
                      for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){
                        const a=rs[i],b=rs[j],x=a.r,y=b.r;
                        const w=Math.min(x.right,y.right)-Math.max(x.left,y.left),h=Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top);
                        if(w>.5&&h>.5)problems.push('Superposition '+name(a.e)+' / '+name(b.e));
                        else if((w>8&&h<=0&&h>-7.5)||(h>8&&w<=0&&w>-7.5))problems.push('Espacement '+name(a.e)+' / '+name(b.e));
                      }
                      if(document.documentElement.scrollWidth>innerWidth+1)problems.push('Débordement horizontal');
                      return {problems,controls:controls.length};
                    });
                    for(const control of await page.locator('button:visible:not(:disabled),input:visible,select:visible').all()){
                      await control.scrollIntoViewIfNeeded();
                      assert.ok(await control.evaluate(e=>{const r=e.getBoundingClientRect();const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);return !!hit&&(e===hit||e.contains(hit));}),'Cible tactile masquée '+await control.getAttribute('id'));
                    }
                    if(screen==='payment'){
                      const a=await page.locator('#pay-cash').boundingBox(),b=await page.locator('#pay-sumup').boundingBox();
                      assert.ok(Math.abs(a.y-b.y)<1&&Math.abs(a.width-b.width)<1&&Math.abs(a.height-b.height)<1&&b.x>a.x+a.width,'Paiements non alignés');
                    }
                    assert.deepEqual(result.problems,[],width+'x'+height+' '+screen);
                    assert.deepEqual(errors,[]);
                    report.push({width,height,screen,controls:result.controls,ok:true});
                    if(height>=640&&(width===360||width===720))await page.screenshot({path:'interface-report/'+width+'-'+screen+'.png',fullPage:true});
                  };
                  await inspect('home');
                  await page.locator('#home [data-go=reservation]').click();await inspect('reservation');
                  await page.locator('#reservation-client').fill('Client réservation fictif');
                  await page.locator('#reservation-from').fill('Départ test');
                  await page.locator('#reservation-to').fill('Destination test');
                  await page.locator('#reservation-date').fill('2030-01-01');
                  await page.locator('#reservation-time').fill('12:30');
                  await page.locator('#reservation button[type=submit]').click();
                  await page.locator('[data-go=direct]').click();await inspect('direct');
                  await page.locator('#direct-client').fill('Client direct fictif');
                  await page.locator('#direct-from').fill('Départ direct');
                  await page.locator('#direct-to').fill('Destination directe');
                  await page.locator('#direct button[type=submit]').click();
                  await page.locator('[data-page=directory]').click();await inspect('directory');
                  assert.match(await page.locator('#directory').innerText(),/Aucun hôtel/);
                  await page.locator('#hotel-name').fill('Hôtel fictif');await page.locator('#hotel-form button[type=submit]').click();
                  await page.locator('#contact-hotel').selectOption({label:'Hôtel fictif'});
                  await page.locator('#pick-contact').click();assert.equal(await page.locator('#person-form').isVisible(),true);
                  await page.locator('#person-form button[type=submit]').click();
                  await page.locator('#contacts-list [data-dir-action=default]').click();
                  await page.locator('#pick-driver').click();await page.locator('#person-form button[type=submit]').click();
                  await page.locator('#directory-sort').selectOption('az');
                  await page.locator('[data-page=home]').click();await page.locator('[data-go=reservation]').click();
                  await page.locator('#reservation-hotel').selectOption({label:'Hôtel fictif'});
                  assert.equal(await page.locator('#reservation-contact option:checked').innerText(),'Personne fictive 1');
                  await page.locator('#reservation-driver').selectOption({label:'Personne fictive 2'});
                  await page.locator('[data-page=directory]').click();
                  await page.locator('#drivers-list [data-dir-action=delete]').click();await page.locator('#directory-delete-cancel').click();
                  assert.equal(await page.locator('#drivers-list article').count(),1);
                  await page.locator('#drivers-list [data-dir-action=delete]').click();await page.locator('#directory-delete-confirm').click();
                  assert.equal(await page.locator('#drivers-list article').count(),0);
                  await page.reload();await page.locator('[data-page=directory]').click();
                  assert.equal(await page.locator('#hotels-list article').count(),1);assert.match(await page.locator('#contacts-list').innerText(),/Contact par défaut/);
                  assert.equal(await page.locator('#drivers-list article').count(),0);
                  await page.locator('[data-page=accounts]').click();await inspect('accounts');
                  await page.locator('[data-page=home]').click();await page.locator('[data-go=archives]').click();await inspect('archives');
                  assert.equal(await page.locator('#archive-list article').count(),0);
                  await page.reload();await page.locator('[data-page=planning]').click();await inspect('planning');
                  assert.equal(await page.locator('#course-list article').count(),2);
                  await page.locator('#course-list article').filter({hasText:'Client réservation fictif'}).locator('button').click();await inspect('ride');
                  await page.locator('#ride-next').click();
                  assert.match(await page.locator('#ride-step').innerText(),/Client chargé/);
                  await page.locator('#ride-next').click();
                  assert.match(await page.locator('#ride-step').innerText(),/Course en cours/);
                  const call=await page.evaluate(()=>window.wazeCalls[0]);
                  assert.equal(call.destination,'Destination test');
                  assert.equal(await page.evaluate(()=>window.wazeCalls.length),1);
                  assert.equal(await page.locator('#waze-reopen').isVisible(),true);
                  await page.locator('#waze-overlay').click();assert.equal(await page.evaluate(()=>window.overlayRequests),1);
                  await page.locator('[data-page=home]').click();
                  await page.evaluate(id=>window.dispatchEvent(new CustomEvent('taxi-return-active-course',{detail:{courseId:id}})),call.id);
                  assert.equal(await page.locator('#ride').isVisible(),true);
                  assert.match(await page.locator('#ride-step').innerText(),/Course en cours/);
                  assert.deepEqual(await page.evaluate(()=>window.wazeAcks),[call.id]);
                  await page.evaluate(id=>window.dispatchEvent(new CustomEvent('taxi-waze-result',{detail:{courseId:id,status:'error',error:'Waze indisponible'}})),call.id);
                  assert.match(await page.locator('#status').innerText(),/Waze indisponible/);
                  assert.match(await page.locator('#ride-step').innerText(),/Course en cours/);
                  await page.locator('#waze-reopen').click();assert.equal(await page.evaluate(()=>window.wazeCalls.length),2);
                  await page.locator('#ride-next').click();await inspect('payment');
                  await page.locator('#pay-cash').click();
                  assert.equal(await page.locator('#payment').isVisible(),true);
                  for(const invalid of ['0','-10','2,345','1e3','abc']){
                    await page.locator('#amount').fill(invalid);await page.locator('#pay-cash').click();
                    assert.equal(await page.locator('#payment').isVisible(),true);
                    assert.equal(await page.locator('#status').getAttribute('data-error'),'true');
                  }
                  await page.locator('#amount').fill('50,25');await page.locator('#pay-cash').click();await inspect('cash');
                  assert.match(await page.locator('#cash-confirm-amount').innerText(),/50,25/);
                  await page.locator('[data-go=payment]:visible').click();await page.locator('#pay-sumup').click();await inspect('sumup');
                  await page.locator('[data-page=planning]').click();
                  await page.locator('#course-list article').filter({hasText:'Client direct fictif'}).locator('button').click();
                  await page.locator('#ride-next').click();await page.locator('#ride-next').click();
                  assert.equal(await page.evaluate(()=>window.wazeCalls[2].destination),'Destination directe');
                  await page.locator('[data-page=planning]').click();
                  const pending=page.locator('#course-list article').filter({hasText:'Client réservation fictif'});
                  assert.match(await pending.innerText(),/En attente de paiement/);
                  const untouched=page.locator('#course-list article').filter({hasText:'Client direct fictif'});
                  assert.match(await untouched.innerText(),/Course en cours/);
                  await page.reload();await page.locator('[data-page=planning]').click();
                  await page.locator('#course-list article').filter({hasText:'Client réservation fictif'}).locator('button').click();
                  assert.equal(await page.locator('#payment').isVisible(),true);
                  await page.locator('#amount').fill('50,25');await page.locator('#pay-cash').click();
                  await page.evaluate(()=>{window.originalSetItem=Storage.prototype.setItem;Storage.prototype.setItem=function(){throw Error('Écriture locale impossible');};});
                  await page.locator('#cash-confirm').click();
                  assert.equal(await page.locator('#cash').isVisible(),true);
                  assert.match(await page.locator('#status').innerText(),/Écriture locale impossible/);
                  assert.equal(await page.evaluate(()=>JSON.parse(localStorage.getItem('mon-taxi-android-refonte:v1')).state.ledger.length),0);
                  await page.evaluate(()=>{Storage.prototype.setItem=window.originalSetItem;});
                  await page.locator('#cash-confirm').click();
                  assert.equal(await page.locator('#home').isVisible(),true);
                  assert.match(await page.locator('#home-cash').innerText(),/50,25/);
                  await page.evaluate(()=>document.getElementById('cash-confirm').click());
                  assert.equal(await page.evaluate(()=>window.terminalCalls),0);
                  const ledger=await page.evaluate(()=>JSON.parse(localStorage.getItem('mon-taxi-android-refonte:v1')).state.ledger);
                  assert.equal(ledger.length,1);assert.equal(ledger[0].method,'cash');assert.equal(ledger[0].amountCents,5025);
                  assert.equal(ledger[0].reference,'cash:'+ledger[0].courseId);assert.ok(ledger[0].paidAt);
                  await page.locator('[data-page=accounts]').click();
                  assert.match(await page.locator('#accounts-cash').innerText(),/50,25/);
                  await page.reload();
                  assert.match(await page.locator('#home-cash').innerText(),/50,25/);
                  await page.locator('[data-go=archives]').click();
                  assert.equal(await page.locator('#archive-list article').count(),1);
                  assert.match(await page.locator('#archive-list').innerText(),/Espèces.*50,25/);
                  await page.locator('[data-page=planning]').click();
                  assert.equal(await page.locator('#course-list article').count(),1);
                  assert.match(await page.locator('#course-list').innerText(),/Client direct fictif/);
                  await page.locator('#course-list article button').click();await page.locator('#ride-next').click();
                  await page.locator('#amount').fill('60,00');await page.locator('#pay-sumup').click();
                  await page.locator('#sumup-confirm').click();
                  const first=await page.evaluate(()=>window.sumupAttempts[0]);
                  assert.equal(first.amountCents,6000);
                  assert.equal(await page.locator('#sumup-confirm').isVisible(),false);
                  await page.evaluate(()=>document.getElementById('sumup-confirm').click());
                  assert.equal(await page.evaluate(()=>window.terminalCalls),1);
                  const emit=async d=>page.evaluate(d=>window.dispatchEvent(new CustomEvent('mon-taxi-sumup-result',{detail:d})),d);
                  await emit({...first,attemptId:'wrong',status:'success',transactionCode:'fake'});
                  assert.equal(await page.locator('#sumup').isVisible(),true);
                  await emit({...first,status:'declined'});
                  assert.equal(await page.locator('#payment').isVisible(),true);
                  await page.locator('#pay-sumup').click();await page.locator('#sumup-confirm').click();
                  const second=await page.evaluate(()=>window.sumupAttempts[1]);assert.notEqual(first.attemptId,second.attemptId);
                  await emit({...second,status:'uncertain'});
                  assert.match(await page.locator('#status').innerText(),/Statut incertain/);
                  await page.reload();await page.locator('[data-page=planning]').click();await page.locator('#course-list article button').click();
                  assert.equal(await page.locator('#sumup-confirm').isVisible(),false);
                  await emit({...second,status:'success',transactionCode:'TX-TEST',amountCents:5999});
                  assert.equal(await page.locator('#sumup').isVisible(),true);
                  await emit({...second,status:'success',transactionCode:'TX-TEST'});
                  assert.equal(await page.locator('#home').isVisible(),true);
                  assert.match(await page.locator('#home-card').innerText(),/60,00/);
                  await emit({...second,status:'success',transactionCode:'TX-TEST'});
                  const finalLedger=await page.evaluate(()=>JSON.parse(localStorage.getItem('mon-taxi-android-refonte:v1')).state.ledger);
                  assert.equal(finalLedger.length,2);assert.equal(finalLedger[1].method,'sumup');assert.equal(finalLedger[1].amountCents,6000);
                  await page.locator('[data-go=archives]').click();assert.equal(await page.locator('#archive-list article').count(),2);
                  await page.locator('[data-page=accounts]').click();
                  await page.locator('#entry-appli').fill('20,00');await page.locator('#entry-commission').fill('10,00');await page.locator('#entry-fuel').fill('15,00');await page.locator('#entry-expense').fill('5,00');
                  await page.locator('#accounts-entry button[type=submit]').click();
                  assert.match(await page.locator('#accounts-cashReal').innerText(),/40,25/);
                  assert.match(await page.locator('#accounts-fee').innerText(),/1,01/);
                  assert.match(await page.locator('#accounts-cardNet').innerText(),/58,99/);
                  assert.match(await page.locator('#accounts-revenue').innerText(),/119,24/);
                  await page.locator('#monthly-fixed').fill('300,00');await page.locator('#fixed-entry button[type=submit]').click();
                  await page.locator('#backup-export').click();
                  const backup=await page.evaluate(()=>window.savedBackup);assert.equal(JSON.parse(backup).state.ledger.length,2);
                  await page.locator('#entry-appli').fill('30,00');await page.locator('#accounts-entry button[type=submit]').click();
                  await page.locator('#backup-import').click();assert.equal(await page.locator('#backup-review').isVisible(),true);
                  await page.locator('#backup-cancel').click();assert.match(await page.locator('#accounts-revenue').innerText(),/129,24/);
                  await page.locator('#backup-import').click();await page.locator('#backup-restore').click();
                  assert.match(await page.locator('#accounts-revenue').innerText(),/119,24/);
                  await page.reload();await page.locator('[data-page=accounts]').click();assert.match(await page.locator('#accounts-revenue').innerText(),/119,24/);
                }catch(e){report.push({width,height,ok:false,error:e.message});process.exitCode=1}
                finally{await context.close();fs.writeFileSync('interface-report/results.json',JSON.stringify(report,null,2))}
              }
            }finally{await browser.close()}
            for(const row of report)console.log(JSON.stringify(row));
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node .interface-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-fold
          path: interface-report/
