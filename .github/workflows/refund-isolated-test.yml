name: Remboursements - tests isolés sans publication
on:
  push:
    branches: [test/remboursement-2101-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refund-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe
        run: |
          node --check refonte/clean-core.js
          node --check refonte/course-controller.js
          node --check refonte/course-ui.js
      - name: Tests de non-régression existants
        run: node tests/refonte-reliability.cjs
      - name: Tests des remboursements fictifs
        run: node tests/refonte-refund.cjs
      - run: npm install --no-save playwright
      - run: command -v google-chrome || npx playwright install --with-deps chromium
      - name: Test interface Fold sans paiement réel
        run: |
          mkdir -p refund-preview
          node tests/refonte-refund-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-remboursement-fictif
          path: refund-preview/
          if-no-files-found: ignore
