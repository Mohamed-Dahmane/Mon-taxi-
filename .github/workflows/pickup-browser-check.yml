name: Vérifier les formulaires Dépose et Pick-up
on:
  push:
    branches: [test/pickup-form-v18]
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: |
          python -m http.server 8765 >/tmp/montaxi-http.log 2>&1 &
          CHROME_PATH="$(command -v google-chrome)" python tests/pickup_browser_check.py
