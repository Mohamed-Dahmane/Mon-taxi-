name: Synchroniser SumUp vers Mon Taxi V11
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
concurrency:
  group: taxi-sumup-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify required private configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        run: |
          test -n "$SUMUP_API_KEY" || { echo "Missing SUMUP_API_KEY secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY secret"; exit 1; }
      - name: Diagnose credential type without revealing credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os, json, base64
          from urllib.parse import urlparse
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
          expected = 'uenyvsiturkihectolxp'
          parsed = urlparse(os.environ['SUPABASE_URL'].strip())
          if (parsed.scheme != 'https' or parsed.hostname != expected + '.supabase.co'
                  or parsed.port is not None or parsed.username is not None
                  or parsed.password is not None or parsed.path not in ('', '/')
                  or parsed.query or parsed.fragment):
              raise SystemExit('Configuration error: SUPABASE_URL must be the expected HTTPS project origin.')
          if key.startswith('sb_secret_'):
              raise SystemExit('Configuration error: this protected Edge Function requires a service_role JWT; a modern sb_secret_ key cannot be used as its Bearer token. Configure a service_role JWT in the existing GitHub secret, without printing it.')
          elif key.startswith('sb_publishable_'):
              raise SystemExit('Configuration error: a public key was stored as the server credential.')
          else:
              try:
                  payload = key.split('.')[1]
                  claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
              except Exception:
                  raise SystemExit('Configuration error: server credential is not a recognized key format.')
              if claims.get('role') != 'service_role':
                  raise SystemExit('Configuration error: JWT is not a service_role credential.')
              if claims.get('ref') != expected:
                  raise SystemExit('Configuration error: server credential belongs to another project.')
              print('Credential format: service_role JWT for the expected project (signature checked by server).')
          PYCODE
      - name: Verify credential with Supabase before sync
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os, urllib.request, urllib.error
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()
          url='https://uenyvsiturkihectolxp.supabase.co/rest/v1/taxi_sumup_transactions?select=transaction_id&limit=0'
          request=urllib.request.Request(url,headers={'apikey':key,'Authorization':'Bearer '+key})
          # Never forward privileged headers to a redirect destination.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(request,timeout=20) as response:
                  print('Supabase verified server access: HTTP '+str(response.status))
          except urllib.error.HTTPError as error:
              print('Supabase server credential validation: HTTP '+str(error.code))
              body=error.read().decode('utf-8','replace').lower()
              categories={'invalid api key':'invalid_api_key','invalid jwt':'invalid_jwt','legacy api keys are disabled':'legacy_keys_disabled','permission denied':'database_permission_denied','invalid signature':'invalid_signature','expired':'credential_expired','disabled':'credential_disabled','forbidden':'forbidden'}
              print('Safe rejection categories: '+','.join(label for pattern,label in categories.items() if pattern in body))
              raise SystemExit('Stored server credential was rejected by Supabase; sync stopped.')
          PYCODE
      - name: Invoke protected sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f response.json' EXIT
          status=$(curl --proto '=https' --tlsv1.2 --max-filesize 16384 --max-time 90 --connect-timeout 15 --retry 2 --retry-delay 3 --retry-connrefused --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL%/}/functions/v1/taxi-sumup-sync" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "X-SumUp-Api-Key: $SUMUP_API_KEY" \
            --header "Content-Type: application/json" --data '{}')
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "SumUp sync failed (response intentionally not printed)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("response.json") as f: result=json.load(f)
          if not isinstance(result, dict) or result.get("ok") is not True:
              raise SystemExit("Sync did not report success")
          if result.get("window_start") != "2026-11-01":
              raise SystemExit("Sync response has an unexpected date window")
          processed = result.get("processed")
          if type(processed) is not int or processed < 0:
              raise SystemExit("Sync response has an invalid processed count")
          print("SumUp sync returned a valid success summary (financial details omitted).")
          PY
