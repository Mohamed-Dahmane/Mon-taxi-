name: Validation complète Mon Taxi
on:
  push:
    branches:
      - fix/standard-dropdown-navigation-20261122
    paths:
      - .github/workflows/full-validation.yml
      - index.html
      - driver-directory.js
      - driver-directory.test.cjs
      - driver-directory.browser.cjs
      - standard-menu.browser.cjs
  workflow_dispatch:
jobs:
  syntax:
    name: Syntaxe JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check driver-directory.js
          node --check driver-directory.browser.cjs
          node --check standard-menu.browser.cjs
          node --check hold-reorder.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          for(let i=0;i<scripts.length;i++)if(scripts[i][1].trim())new vm.Script(scripts[i][1],{filename:'index inline '+i});
          console.log('Scripts inline vérifiés:',scripts.length);
          NODE
  unit:
    name: Tests de logique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test driver-directory.test.cjs
  standard:
    name: Menu The Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node standard-menu.browser.cjs
  browser:
    name: Parcours navigateur complet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node driver-directory.browser.cjs
