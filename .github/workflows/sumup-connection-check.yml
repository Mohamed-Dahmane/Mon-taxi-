name: Vérifier connexion SumUp (privé)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sumup:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier présence du secret sans l'afficher
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        shell: bash
        run: |
          if [ -z "$SUMUP_API_KEY" ]; then
            echo "::error::Secret SUMUP_API_KEY absent. Ajoutez-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secret présent (valeur masquée)."
      - name: Tester l'authentification sans publier les données
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 2 --retry-delay 2 --header "Authorization: Bearer $SUMUP_API_KEY" --header 'Accept: application/json' 'https://api.sumup.com/v0.1/me')"
          case "$code" in
            200) echo "Authentification SumUp validée. Aucun paiement ni montant téléchargé ou publié." ;;
            401|403) echo "::error::Authentification SumUp refusée (HTTP $code). Vérifiez le secret et ses autorisations."; exit 1 ;;
            *) echo "::error::Réponse SumUp inattendue (HTTP $code). Aucun contenu de réponse affiché."; exit 1 ;;
          esac
      - name: Vérifier accès à l'historique des transactions sans publier de recettes
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          # Never print, upload, cache or persist the API response.
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 1 --header "Authorization: Bearer $SUMUP_API_KEY" --header 'Accept: application/json' 'https://api.sumup.com/v0.1/me/transactions/history?limit=1')"
          case "$code" in
            200) echo "Accès à l'historique SumUp autorisé (HTTP 200). Aucun montant ni transaction enregistré." ;;
            401) echo "::error::Accès historique refusé (HTTP 401) : clé ou authentification à vérifier."; exit 1 ;;
            403) echo "::error::Accès historique interdit (HTTP 403) : autorisation de lecture des transactions à vérifier."; exit 1 ;;
            404) echo "::error::Route historique indisponible (HTTP 404) : vérifier la route API avant de conclure sur les permissions."; exit 1 ;;
            *) echo "::error::Vérification historique non validée (HTTP $code), sans contenu de réponse."; exit 1 ;;
          esac
      - name: Vérifier le filtre de départ au 1er novembre 2026 (sans publier de données)
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          # Only checks the API's acceptance of the lower date bound.
          # No response body, amounts, transaction identifiers or API key are logged or stored.
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 1 --get --header "Authorization: Bearer $SUMUP_API_KEY" --header 'Accept: application/json' --data-urlencode 'limit=1' --data-urlencode 'oldest_time=2026-10-31T23:00:00Z' 'https://api.sumup.com/v0.1/me/transactions/history')"
          if [ "$code" = 200 ]; then
            echo "Filtre historique depuis le 01/11/2026 accepté par SumUp. Aucune recette publiée."
          else
            echo "::warning::Filtre v0.1 non validé (HTTP $code). Poursuite du test alternatif v2.1."
          fi
      - name: Tester API SumUp v2.1 avec date belge et pagination limitée
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          # Merchant identity and payment response remain only in runner memory.
          merchant_code="$(curl --fail --silent --show-error --max-time 20 --header "Authorization: Bearer $SUMUP_API_KEY" 'https://api.sumup.com/v0.1/me' | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("merchant_code") or (d.get("merchant_profile") or {}).get("merchant_code") or "")')"
          if [[ ! "$merchant_code" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::warning::Code marchand non trouvé dans le profil; impossible de tester v2.1."
            exit 0
          fi
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --get --header "Authorization: Bearer $SUMUP_API_KEY" --header 'Accept: application/json' --data-urlencode 'limit=1' --data-urlencode 'oldest_time=2026-10-31T23:00:00Z' "https://api.sumup.com/v2.1/merchants/$merchant_code/transactions/history")"
          if [ "$code" = 200 ]; then
            echo "API SumUp v2.1 accessible avec borne du 01/11/2026 (heure de Bruxelles)."
          else
            echo "::warning::API v2.1 indisponible (HTTP $code); l'ancienne API reste testable séparément."
          fi
