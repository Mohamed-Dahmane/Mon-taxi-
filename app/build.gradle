plugins { id 'com.android.application' }
android {
 namespace 'be.montaxi.gestion'
 compileSdk 35
 defaultConfig { applicationId 'be.montaxi.gestion.empreinte'; minSdk 26; targetSdk 35; versionCode 12; versionName '12.0-empreinte' }
}

// Signature stable facultative : les secrets ne doivent jamais être publiés dans GitHub.
def signingFile = System.getenv('TAXI_SIGNING_STORE_FILE')
def signingPassword = System.getenv('TAXI_SIGNING_STORE_PASSWORD')
def signingAlias = System.getenv('TAXI_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('TAXI_SIGNING_KEY_PASSWORD')
if (signingFile && signingPassword && signingAlias && signingKeyPassword) {
 android.signingConfigs { taxiRelease {
  storeFile file(signingFile)
  storePassword signingPassword
  keyAlias signingAlias
  keyPassword signingKeyPassword
 } }
 android.buildTypes { release { signingConfig android.signingConfigs.taxiRelease; minifyEnabled false } }
}
